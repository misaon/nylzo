version: 2
project_name: nylzo

before:
  hooks:
    - node automation/web-install/main.ts
    - env NYLZO_VERSION={{ .Version }} pnpm --dir web --filter @nylzo/web build
    - node tools/deploy/bundle.mts .host-bundle/nylzo-host_{{ .Version }}.tar

builds:
  - id: nylzo
    main: &main ./cmd/nylzo
    binary: nylzo
    env: &env
      - CGO_ENABLED=0
      - GOEXPERIMENT=runtimesecret
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: &flags
      - -trimpath
    ldflags: &ldflags
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }} -X main.dirty={{ .IsGitDirty }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: caddy
    dir: deploy/caddy
    main: &caddy_main .
    binary: caddy
    env: &caddy_env
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: &caddy_flags
      - -trimpath
      - -buildvcs=false
      - '-tags={{ mustReadFile "deploy/caddy/build-tags" }}'
    ldflags: &caddy_ldflags
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: nylzo
    ids: [nylzo]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "nylzo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
  - id: caddy
    ids: [caddy]
    formats: [tar.gz]
    name_template: "nylzo-caddy_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: deploy/caddy/kodata/LICENSE
        strip_parent: true
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: internal/server/web/dist/*.html
    - glob: internal/server/web/dist/assets/*
    - glob: .host-bundle/nylzo-host_{{ .Version }}.tar

sboms:
  - artifacts: archive

kos:
  - id: nylzo
    build: nylzo
    main: *main
    base_image: gcr.io/distroless/static-debian13:nonroot@sha256:d62067879de890a1def9da0e7766b7d20810a5e5555cef8506b752437d7a3e88
    repositories: [ghcr.io/misaon/nylzo]
    platforms: [linux/amd64, linux/arm64]
    tags: ["staging-{{ .Version }}"]
    bare: true
    sbom: spdx
    creation_time: "{{ .CommitTimestamp }}"
    ko_data_creation_time: "{{ .CommitTimestamp }}"
    env: *env
    flags: *flags
    ldflags: *ldflags
    labels:
      org.opencontainers.image.source: https://github.com/misaon/nylzo
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: MIT
  - id: caddy
    build: caddy
    main: *caddy_main
    working_dir: deploy/caddy
    base_image: gcr.io/distroless/static-debian13:nonroot@sha256:d62067879de890a1def9da0e7766b7d20810a5e5555cef8506b752437d7a3e88
    repositories: [ghcr.io/misaon/nylzo-caddy]
    user: "65533:65533"
    platforms: [linux/amd64, linux/arm64]
    tags: ["staging-{{ .Version }}"]
    bare: true
    sbom: spdx
    creation_time: "{{ .CommitTimestamp }}"
    ko_data_creation_time: "{{ .CommitTimestamp }}"
    env: *caddy_env
    flags: *caddy_flags
    ldflags: *caddy_ldflags
    labels:
      org.opencontainers.image.source: https://github.com/misaon/nylzo
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: Apache-2.0

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]

docker_signs:
  - id: images
    cmd: cosign
    artifacts: manifests
    args: [sign, "${artifact}@${digest}", --yes]

changelog:
  use: git
  sort: asc
  abbrev: 7
  format: "{{ .Message }} ([{{ .SHA }}](https://github.com/misaon/nylzo/commit/{{ .SHA }}))"
  groups:
    - title: "⚠️ Breaking changes"
      regexp: '^[a-z]+(\([^)]*\))?!: '
      order: 0
    - title: "✨ Features"
      regexp: '^feat(\([^)]*\))?: '
      order: 10
    - title: "🔒 Security"
      regexp: '^security(\([^)]*\))?: '
      order: 15
    - title: "🐛 Fixes"
      regexp: '^fix(\([^)]*\))?: '
      order: 20
    - title: "⚡ Performance"
      regexp: '^perf(\([^)]*\))?: '
      order: 30
    - title: "♻️ Refactoring"
      regexp: '^refactor(\([^)]*\))?: '
      order: 40
    - title: "📚 Documentation"
      regexp: '^docs(\([^)]*\))?: '
      order: 50
    - title: "✅ Tests"
      regexp: '^test(\([^)]*\))?: '
      order: 60
    - title: "📦 Build"
      regexp: '^build(\([^)]*\))?: '
      order: 70
    - title: "👷 CI"
      regexp: '^ci(\([^)]*\))?: '
      order: 80
    - title: "🎨 Style"
      regexp: '^style(\([^)]*\))?: '
      order: 90
    - title: "🧹 Maintenance"
      regexp: '^chore(\([^)]*\))?: '
      order: 100
    - title: "⏪ Reverts"
      regexp: '^revert(\([^)]*\))?: '
      order: 110
    - title: Other changes
      order: 999

release:
  name_template: "Nylzo {{ .Tag }}"
  draft: true
  prerelease: false
  extra_files:
    - glob: .host-bundle/nylzo-host_{{ .Version }}.tar
  header: |
    ## Download Nylzo {{ .Version }}

    | Platform | Architecture | Download |
    | --- | --- | --- |
    | Windows | x64 | [ZIP](https://github.com/misaon/nylzo/releases/download/{{ .Tag }}/nylzo_{{ .Version }}_windows_amd64.zip) |
    | Windows | ARM64 | [ZIP](https://github.com/misaon/nylzo/releases/download/{{ .Tag }}/nylzo_{{ .Version }}_windows_arm64.zip) |
    | Linux | x64 | [tar.gz](https://github.com/misaon/nylzo/releases/download/{{ .Tag }}/nylzo_{{ .Version }}_linux_amd64.tar.gz) |
    | Linux | ARM64 | [tar.gz](https://github.com/misaon/nylzo/releases/download/{{ .Tag }}/nylzo_{{ .Version }}_linux_arm64.tar.gz) |
    | macOS | Intel | [tar.gz](https://github.com/misaon/nylzo/releases/download/{{ .Tag }}/nylzo_{{ .Version }}_darwin_amd64.tar.gz) |
    | macOS | Apple silicon | [tar.gz](https://github.com/misaon/nylzo/releases/download/{{ .Tag }}/nylzo_{{ .Version }}_darwin_arm64.tar.gz) |

    Each archive contains the CLI and embedded web client. Linux and macOS also support the server; use WSL or Docker to run the server on Windows.

    Source: [{{ .ShortCommit }}](https://github.com/misaon/nylzo/commit/{{ .FullCommit }}). Source commit date: {{ .CommitDate }}. Run `nylzo version --json` for the binary's source identity. Verify downloads using the signatures and provenance below before execution.

  footer: |
    Verify a download or the image before you run it:

    ```bash
    cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity "https://github.com/misaon/nylzo/.github/workflows/release.yml@refs/tags/{{ .Tag }}"
    sha256sum --ignore-missing -c checksums.txt
    gh attestation verify nylzo_{{ .Version }}_linux_amd64.tar.gz --repo misaon/nylzo --signer-workflow misaon/nylzo/.github/workflows/release.yml --source-ref refs/tags/{{ .Tag }} --deny-self-hosted-runners
    gh attestation verify oci://ghcr.io/misaon/nylzo:{{ .Version }} --repo misaon/nylzo --signer-workflow misaon/nylzo/.github/workflows/release.yml --source-ref refs/tags/{{ .Tag }} --deny-self-hosted-runners
    cosign verify ghcr.io/misaon/nylzo:{{ .Version }} --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity "https://github.com/misaon/nylzo/.github/workflows/release.yml@refs/tags/{{ .Tag }}"
    cosign verify ghcr.io/misaon/nylzo-caddy:{{ .Version }} --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity "https://github.com/misaon/nylzo/.github/workflows/release.yml@refs/tags/{{ .Tag }}"
    ```

    `checksums.txt` also lists the files of the embedded web client, the `nylzo-caddy` archives (the Caddy build for self-hosting) and `nylzo-host_{{ .Version }}.tar`, the host configuration that Hetzner Flatcar servers verify and install.

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"
