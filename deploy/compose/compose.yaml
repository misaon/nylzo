name: nylzo

services:
  nylzo:
    image: ${NYLZO_IMAGE:?set NYLZO_IMAGE to a verified image reference with its digest}
    command: [serve]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.5
    pids_limit: 128
    ulimits:
      memlock: -1
      core: 0
    environment:
      NYLZO_LISTEN: ":8080"
      NYLZO_DATA_DIR: /home/nonroot
      NYLZO_EPOCH_DIR: /run/nylzo-epoch
      NYLZO_PEPPER_FILE: /run/secrets/nylzo_pepper
      NYLZO_REPORT_KEY: ${NYLZO_REPORT_KEY:?set NYLZO_REPORT_KEY; create it with nylzo report-key on your own computer}
      NYLZO_TRUSTED_PROXIES: 172.30.82.2/32,fd1f:9791:e50b:1::2/128
      NYLZO_GLOBAL_DAILY_CREATES: ${NYLZO_GLOBAL_DAILY_CREATES:-2000}
      NYLZO_OPERATOR: ${NYLZO_OPERATOR:-}
      NYLZO_CONTACT: ${NYLZO_CONTACT:-}
      NYLZO_HOSTING: ${NYLZO_HOSTING:-}
      NYLZO_PUBLIC_URL: https://${NYLZO_DOMAIN:?set NYLZO_DOMAIN to the public host name}
    secrets: [nylzo_pepper]
    volumes:
      - nylzo-data:/home/nonroot
      - type: bind
        source: /run/nylzo/epoch
        target: /run/nylzo-epoch
        bind:
          create_host_path: false
    networks:
      backend:
        ipv4_address: 172.30.82.3
        ipv6_address: fd1f:9791:e50b:1::3
    logging: &logging
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: ${NYLZO_CADDY_IMAGE:?set NYLZO_CADDY_IMAGE to the verified Caddy image of the same release with its digest}
    command: [run, --config, /etc/caddy/Caddyfile, --adapter, nylzo]
    user: "65533:65533"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 256
    ulimits:
      core: 0
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    environment:
      NYLZO_DOMAIN: ${NYLZO_DOMAIN:?set NYLZO_DOMAIN to the public host name}
      NYLZO_CONTACT: ${NYLZO_CONTACT:-}
      XDG_DATA_HOME: /var/lib/caddy
      XDG_CONFIG_HOME: /var/lib/caddy/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    logging: *logging
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ./caddy-state
        target: /var/lib/caddy
        bind:
          create_host_path: false
    depends_on: [nylzo]
    networks:
      backend:
        ipv4_address: 172.30.82.2
        ipv6_address: fd1f:9791:e50b:1::2
      edge: {}

secrets:
  nylzo_pepper:
    file: ./secrets/pepper

volumes:
  nylzo-data:

networks:
  backend:
    internal: true
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
      com.docker.network.bridge.gateway_mode_ipv6: isolated
    ipam:
      config:
        - subnet: 172.30.82.0/24
          ip_range: 172.30.82.128/25
        - subnet: fd1f:9791:e50b:1::/64
          ip_range: fd1f:9791:e50b:1:8000::/65
  edge:
    enable_ipv6: true
