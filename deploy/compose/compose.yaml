name: nylzo

services:
  nylzod:
    image: ${NYLZO_IMAGE:?set NYLZO_IMAGE to a verified image reference with its digest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      NYLZO_LISTEN: ":8080"
      NYLZO_DATA_DIR: /home/nonroot
      NYLZO_PEPPER_FILE: /run/secrets/nylzo_pepper
      NYLZO_TRUSTED_PROXIES: 172.30.80.0/24
    secrets: [nylzo_pepper]
    volumes:
      - nylzo-data:/home/nonroot
    networks: [nylzo]

  caddy:
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      NYLZO_DOMAIN: ${NYLZO_DOMAIN:?set NYLZO_DOMAIN to the public host name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [nylzod]
    networks: [nylzo]

secrets:
  nylzo_pepper:
    file: ./secrets/pepper

volumes:
  nylzo-data:
  caddy-data:
  caddy-config:

networks:
  nylzo:
    ipam:
      config:
        - subnet: 172.30.80.0/24
