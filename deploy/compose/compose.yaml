name: nylzo

services:
  nylzo:
    image: ${NYLZO_IMAGE:?set NYLZO_IMAGE to a verified image reference with its digest}
    command: [serve]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      NYLZO_LISTEN: ":8080"
      NYLZO_DATA_DIR: /home/nonroot
      NYLZO_PEPPER_FILE: /run/secrets/nylzo_pepper
      NYLZO_REPORT_KEY: ${NYLZO_REPORT_KEY:?set NYLZO_REPORT_KEY; create it with nylzo report-key on your own computer}
      NYLZO_TRUSTED_PROXIES: 172.30.80.2/32,fd1f:9791:e50b::2/128
      NYLZO_GLOBAL_DAILY_CREATES: ${NYLZO_GLOBAL_DAILY_CREATES:-2000}
      NYLZO_OPERATOR: ${NYLZO_OPERATOR:-}
      NYLZO_CONTACT: ${NYLZO_CONTACT:-}
      NYLZO_HOSTING: ${NYLZO_HOSTING:-}
      NYLZO_PUBLIC_URL: https://${NYLZO_DOMAIN:?set NYLZO_DOMAIN to the public host name}
    secrets: [nylzo_pepper]
    volumes:
      - nylzo-data:/home/nonroot
    networks: [nylzo]
    logging: &logging
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: ${NYLZO_CADDY_IMAGE:?set NYLZO_CADDY_IMAGE to the verified Caddy image of the same release with its digest}
    command: [run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    user: "65533:65533"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 80
    environment:
      NYLZO_DOMAIN: ${NYLZO_DOMAIN:?set NYLZO_DOMAIN to the public host name}
      XDG_DATA_HOME: /var/lib/caddy
      XDG_CONFIG_HOME: /var/lib/caddy/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    logging: *logging
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ./caddy-state
        target: /var/lib/caddy
        bind:
          create_host_path: false
    depends_on: [nylzo]
    networks:
      nylzo:
        ipv4_address: 172.30.80.2
        ipv6_address: fd1f:9791:e50b::2

secrets:
  nylzo_pepper:
    file: ./secrets/pepper

volumes:
  nylzo-data:

networks:
  nylzo:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.80.0/24
          ip_range: 172.30.80.128/25
        - subnet: fd1f:9791:e50b::/64
          ip_range: fd1f:9791:e50b:0:8000::/65
