[Service]
Environment=HOME=/var/lib/nylzo-deploy/home
StateDirectory=nylzo-deploy nylzo-deploy/home
StateDirectoryMode=0700
NoNewPrivileges=true
ProtectSystem=full
ReadWritePaths=/etc/nylzo /etc/caddy /etc/systemd/system /etc/systemd/journald.conf.d /etc/systemd/coredump.conf.d /etc/ssh/sshd_config.d /etc/sysctl.d /etc/docker /etc/containerd /etc/flatcar
ProtectHome=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictSUIDSGID=true
RestrictNamespaces=true
RestrictRealtime=true
LockPersonality=true
MemoryDenyWriteExecute=true
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_FOWNER CAP_NET_ADMIN
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
IPAddressDeny=169.254.0.0/16 fe80::/10
LimitCORE=0
