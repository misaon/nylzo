min_version = "2026.10.9"

[settings]
lockfile = true

[tools]
go = "1.27.3"
goreleaser = "2.20.0"
golangci-lint = "2.15.0"
"aqua:rhysd/actionlint" = "1.7.12"
zizmor = "1.32.0"
shellcheck = "0.11.0"
cosign = "3.1.4"
grype = "0.121.2"
gitsign = "0.18.0"
gh = "2.103.3"
jq = "1.8.2"
osv-scanner = "2.7.0"
opentofu = "1.13.9"
bun = "1.4.4"

[env]
GOTOOLCHAIN = "local"

[tasks."install:web"]
description = "Install the web dependencies exactly as locked"
run = "bun automation/web-install/main.ts"

[tasks."install:automation"]
description = "Install the automation dependencies exactly as locked"
run = "bun install --cwd automation --frozen-lockfile --ignore-scripts"

[tasks.install]
description = "Install the web and automation dependencies exactly as locked"
depends = ["install:web", "install:automation"]

[tasks."build:web"]
description = "Build the web client into internal/server/web/dist, where nylzo embeds it"
depends = ["install:web"]
run = "bun run --cwd web --filter @nylzo/web build"

[tasks.build]
description = "Build bin/nylzo with the web client inside"
depends = ["build:web"]
run = "bun tools/build.mts"

[tasks."dev:web"]
description = "Vite with hot reload on http://localhost:5173, API from mise run dev"
depends = ["install:web"]
run = "bun run --cwd web/app --bun vite"

[tasks."dev:reset"]
description = "Delete the local messages and the pepper in .dev"
run = "rm -rf .dev"

[tasks."test:go"]
description = "Go tests with the race detector and coverage, the timing tests (AK21, AK22, uniform key-check work) on their own, then the Caddyfile edge tests"
run = [
  "mkdir -p .coverage",
  "go test -race -covermode=atomic -coverpkg=./... -coverprofile=.coverage/go.out -count=1 -shuffle=on -skip '^(TestAK21UniformNotFoundAndConflict|TestAK22SlowConnectionsAndLyingContentLength|TestAuthorizeDoesTheSameWorkForKeysThatFailTheKeyCheck)$' ./...",
  "go test -race -count=1 -run '^TestAK21UniformNotFoundAndConflict$' ./internal/server/",
  "go test -race -count=1 -run '^TestAK22SlowConnectionsAndLyingContentLength$' ./internal/server/",
  "go test -race -count=1 -run '^TestAuthorizeDoesTheSameWorkForKeysThatFailTheKeyCheck$' ./internal/server/",
  "GOEXPERIMENT=runtimesecret GOOS=linux go vet ./internal/secretmode/ ./internal/server/",
  '''go -C deploy/caddy test -race -count=1 -tags="$(cat deploy/caddy/build-tags)" ./...''',
]

[tasks."test:web"]
description = "TypeScript core and web client tests with coverage, including the heavy cryptographic cases"
depends = ["install:web"]
env = { NYLZO_HEAVY_TESTS = "1" }
run = ["bun run --cwd web/core --bun playwright install chromium", "bun run --cwd web test:coverage"]

[tasks."test:repository"]
description = "Tests of the automation workspace and the repository tools"
depends = ["install:automation"]
run = [
  "bun run --cwd automation test",
  "bun test --parallel --timeout 300000 tools/*.test.mts tools/*/*.test.mts",
]

[tasks.test]
description = "Every test suite of CI, one after another so the Go timing tests run alone"
run = [{ task = "test:go" }, { task = "test:web" }, { task = "test:repository" }]

[tasks."lint:dependencies"]
description = "Known vulnerabilities, malware and licenses of the locked dependencies, with the source SBOM"
depends = ["install:web"]
run = "bun automation/source-dependency-gate/main.ts .sca-reports --sbom"

[tasks."lint:go"]
description = "Go modules, build, vet, go fix, golangci-lint and govulncheck, with the Caddy module and its release tags"
run = [
  "go mod verify",
  "go mod tidy -diff",
  "go build ./...",
  "GOOS=darwin go vet ./...",
  "go fix -diff ./...",
  "golangci-lint run ./...",
  "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...",
  "go -C deploy/caddy mod verify",
  "go -C deploy/caddy mod tidy -diff",
  '''cd deploy/caddy && golangci-lint run --build-tags="$(cat build-tags)" ./...''',
  '''cd deploy/caddy && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags="$(cat build-tags)" ./...''',
]

[tasks."lint:web"]
description = "Web supply-chain policy, dependency audit, Oxfmt, Oxlint, knip, type checks and svelte-autofixer"
depends = ["install:web"]
run = [
  "bun automation/web-install/policy.ts",
  "bun audit --cwd web --audit-level=moderate",
  "bun run --cwd web lint",
  "bun run --cwd web typecheck",
  "bun run --cwd web --filter @nylzo/web check",
]

[tasks."lint:repository"]
description = "Automation workspace, repository tools, Wiki links, workflows and shell scripts"
shell = "bash -o errexit -o pipefail -c"
depends = ["install:automation"]
run = [
  "bun audit --cwd automation --audit-level=moderate",
  "bun run --cwd automation lint",
  "bun run --cwd automation typecheck",
  "bun tools/check-syntax.mts",
  "bun tools/wiki.mts",
  "actionlint",
  "zizmor --offline --persona pedantic .github/workflows .github/actions",
  "shellcheck mise-tasks/dev mise-tasks/release/* mise-tasks/deploy tools/security/scan-release tools/security/verify-tag tools/security/verify-keyless-tag deploy/hetzner-flatcar/bootstrap/boot deploy/hetzner-flatcar/bootstrap/install deploy/hetzner-flatcar/host/application/{run,prepare,health,recover-os,clean,storage} deploy/hetzner-flatcar/host/update/{update,release-target,release-policy,refresh-tools,install-tools,activate,runtime-stage} deploy/hetzner-flatcar/host/system/{bandwidth,firewall,public-address} deploy/hetzner-flatcar/host/monitoring/{host-policy,host-status,clock,heartbeat,directive} tools/deploy/{validate,vm-test,vm-acceptance,image-vm-test} tools/verify-go-toolchain",
]

[tasks.lint]
description = "Every static check of CI: dependencies, Go, TypeScript, workflows and scripts"
depends = ["lint:dependencies", "lint:go", "lint:web", "lint:repository"]

[tasks."e2e:browsers"]
description = "Download the Playwright browsers once"
depends = ["install:web"]
run = "bun run --cwd web/e2e --bun playwright install chromium firefox webkit"

[tasks.e2e]
description = "Playwright end to end in Chromium, Firefox and WebKit"
depends = ["build:web"]
run = "bun run --cwd web/e2e e2e"
