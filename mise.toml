min_version = "2026.10.9"

[settings]
lockfile = true

[tools]
go = "1.27.3"
node = "24.22.1"
pnpm = "12.15.0"
goreleaser = "2.18.3"
golangci-lint = "2.15.0"
actionlint = "1.7.12"
zizmor = "1.31.1"
shellcheck = "0.11.0"
cosign = "3.1.4"
grype = "0.121.0"
gitsign = "0.18.0"
osv-scanner = "2.7.0"
opentofu = "1.13.2"

[env]
GOTOOLCHAIN = "local"

[tasks.install]
description = "Install the web dependencies exactly as locked"
run = "node tools/security/install-web.mts"

[tasks."build:web"]
description = "Build the web client into internal/server/web/dist, where nylzo embeds it"
depends = ["install"]
run = "pnpm --dir web --filter @nylzo/web build"

[tasks.build]
description = "Build bin/nylzo with the web client inside"
depends = ["build:web"]
run = "node tools/build.mts"

[tasks."dev:web"]
description = "Vite with hot reload on http://localhost:5173, API from mise run dev"
depends = ["install"]
run = "pnpm --dir web --filter @nylzo/web exec vite"

[tasks."dev:reset"]
description = "Delete the local messages and the pepper in .dev"
run = "rm -rf .dev"

[tasks.test]
description = "The Go and TypeScript tests of CI, Go with the race detector"
depends = ["install"]
run = [
  "go test -race -count=1 -shuffle=on -skip '^(TestAK21UniformNotFoundAndConflict|TestAK22SlowConnectionsAndLyingContentLength)$' ./...",
  "go test -race -count=1 -run '^TestAK21UniformNotFoundAndConflict$' ./internal/server/",
  "go test -race -count=1 -run '^TestAK22SlowConnectionsAndLyingContentLength$' ./internal/server/",
  "NYLZO_HEAVY_TESTS=1 pnpm --dir web -r test",
]

[tasks.lint]
description = "Every static check of CI: Go, TypeScript, workflows and scripts"
depends = ["install"]
run = [
  "node tools/sca/scan.mts .sca-reports",
  "go mod verify",
  "go mod tidy -diff",
  "golangci-lint run ./...",
  "GOOS=darwin go vet ./...",
  "go fix -diff ./...",
  "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...",
  "node --test tools/build-info.test.mts tools/ci-plan.test.mts tools/release-checks.test.mts tools/coverage/*.test.mts tools/security/*.test.mts tools/sca/*.test.mts tools/deploy/*.test.mts",
  "actionlint",
  "zizmor --persona pedantic .github/workflows",
  "shellcheck mise-tasks/dev mise-tasks/release/* mise-tasks/deploy tools/security/scan-release tools/security/verify-tag tools/security/bootstrap-policy tools/security/verify-keyless-tag deploy/hetzner-flatcar/bootstrap/boot deploy/hetzner-flatcar/bootstrap/install deploy/hetzner-flatcar/runtime/{run,prepare,health,recover-os,install-tools,update,refresh-tools,clean} tools/deploy/{validate,vm-test,vm-acceptance,image-vm-test}",
  '''awk '/^minimumReleaseAge:/ { found = ($2 + 0 >= 1440) } END { exit !found }' web/pnpm-workspace.yaml''',
  '''grep -Eq '^strictDepBuilds: *true$' web/pnpm-workspace.yaml''',
  '''grep -Eq '^allowBuilds: *\{\}$' web/pnpm-workspace.yaml''',
  "pnpm --dir web audit --audit-level=moderate",
  "pnpm --dir web -r typecheck",
  "pnpm --dir web --filter @nylzo/web check",
]

[tasks."e2e:browsers"]
description = "Download the Playwright browsers once"
depends = ["install"]
run = "pnpm --dir web/e2e exec playwright install chromium firefox webkit"

[tasks.e2e]
description = "Playwright end to end in Chromium, Firefox and WebKit"
depends = ["build:web"]
run = "pnpm --dir web/e2e e2e"
