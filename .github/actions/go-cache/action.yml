name: Go module and build cache
description: >-
  Restores the Go module and build cache of one job, keyed by the Go version and both go.sum files, or saves it.
  Only pushes to main save, and only when the restore missed the exact key, so every key is written once.
inputs:
  scope:
    description: The job the cache belongs to; jobs that build different packages keep separate caches.
    required: true
  save:
    description: "`true` saves instead of restoring; pass the restore's miss so an existing key is not written again."
    default: "false"
outputs:
  hit:
    description: Whether the restore found the exact key.
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: restore
      if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/.cache/golangci-lint
          ~/Library/Caches/go-build
        key: go-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.sum', 'deploy/caddy/go.sum') }}
        restore-keys: go-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-
    - if: inputs.save == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/.cache/golangci-lint
          ~/Library/Caches/go-build
        key: go-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.sum', 'deploy/caddy/go.sum') }}
