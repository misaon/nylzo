name: Checkout and pinned tools
description: >-
  Checks out the repository without persisting credentials and installs the named tools at the versions that mise.toml
  pins. When mise installed Go, it checks that the Go on PATH is the one mise.lock pins.
inputs:
  tools:
    description: Space-separated tools to install; empty installs every tool in mise.toml.
    default: ""
  cache:
    description: "`auto` restores mise's cache and saves it from pushes to main; `none` leaves it out."
    default: auto
  ref:
    description: The ref to check out; empty checks out the commit that started the workflow.
    default: ""
  fetch-depth:
    description: Commits to fetch; 0 fetches the whole history.
    default: "1"
runs:
  using: composite
  steps:
    # Only events that run this repository's own code may name a ref; workflow_run may name the default branch.
    - shell: bash
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ inputs.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        case "${EVENT}" in
          push | pull_request | schedule | workflow_dispatch) ;;
          *)
            if [[ -n "${REF}" && ! ( "${EVENT}" = workflow_run && "${REF}" = "${DEFAULT_BRANCH}" ) ]]; then
              echo "A ${EVENT} job checks out the commit that started it, not ${REF}." >&2
              exit 1
            fi
            ;;
        esac
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: false
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        # renovate: datasource=github-releases depName=jdx/mise
        version: 2026.11.4
        install_args: ${{ inputs.tools }}
        cache: ${{ inputs.cache != 'none' }}
        cache_save: ${{ inputs.cache == 'auto' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    - shell: bash
      run: |
        if mise where go > /dev/null 2>&1; then
          tools/verify-go-toolchain
        else
          echo 'mise installed no Go here, so there is no Go toolchain to check.'
        fi
