name: Checkout and pinned tools
description: >-
  Checks out the repository without persisting credentials and installs the named tools at the versions that mise.toml
  pins. When Go is among them, it checks that the Go on PATH is the one mise.lock pins.
inputs:
  tools:
    description: Space-separated tools to install; empty installs every tool in mise.toml.
    default: ""
  cache:
    description: "`auto` restores mise's cache and saves it from pushes to main; `none` leaves it out."
    default: auto
  ref:
    description: The ref to check out; empty checks out the commit that started the workflow.
    default: ""
  fetch-depth:
    description: Commits to fetch; 0 fetches the whole history.
    default: "1"
runs:
  using: composite
  steps:
    - if: >-
        inputs.ref != '' && (github.event_name == 'pull_request_target' ||
        (github.event_name == 'workflow_run' && inputs.ref != github.event.repository.default_branch))
      shell: bash
      run: |
        echo 'pull_request_target and workflow_run jobs check out their own commit or the default branch, never another ref.' >&2
        exit 1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: false
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        # renovate: datasource=github-releases depName=jdx/mise
        version: 2026.10.23
        install_args: ${{ inputs.tools }}
        cache: ${{ inputs.cache != 'none' }}
        cache_save: ${{ inputs.cache == 'auto' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    - shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        read -r -d '' -a tools <<< "${TOOLS}" || true
        if [[ ${#tools[@]} -eq 0 || " ${tools[*]} " =~ [[:space:]](core:)?go(@[^[:space:]]*)?[[:space:]] ]]; then
          tools/verify-go-toolchain
        fi
