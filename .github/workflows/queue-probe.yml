name: Job queue probe

on:
  push:
    branches: [ci/faster-pipeline]

permissions: {}

jobs:
  probe:
    name: Job-level concurrency accepts queue max
    runs-on: ubuntu-latest
    timeout-minutes: 1
    concurrency:
      group: queue-probe-${{ github.sha }}
      cancel-in-progress: false
      queue: max
    steps:
      - run: echo 'GitHub accepted queue max in a job-level concurrency block.'
