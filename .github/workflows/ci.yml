name: ci

on:
  push:
    branches: [main, "release/v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  DEPENDENCY_APP_SLUG: ${{ vars.DEPENDENCY_APP_SLUG }}
  DEPENDENCY_BOT_ID: ${{ vars.DEPENDENCY_BOT_ID }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.plan.outputs.go }}
      web: ${{ steps.plan.outputs.web }}
      integration: ${{ steps.plan.outputs.integration }}
      repository: ${{ steps.plan.outputs.repository }}
      deployment: ${{ steps.plan.outputs.deployment }}
      dependencies: ${{ steps.plan.outputs.dependencies }}
      actions: ${{ steps.plan.outputs.actions }}
      full: ${{ steps.plan.outputs.full }}
      sca: ${{ steps.plan.outputs.sca }}
      coverage: ${{ steps.plan.outputs.coverage }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
      - id: diff
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ""
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.ref }}
          list-files: json
          filters: |
            changed:
              - '**'
      - id: plan
        name: Select checks from the complete changed-file list
        env:
          EVENT: ${{ github.event_name }}
          CHANGED_FILES: ${{ steps.diff.outputs.changed_files }}
          TRUSTED_COVERAGE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          FORCE_FULL_VERIFICATION: ${{ startsWith(github.ref, 'refs/heads/release/v') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.id == vars.DEPENDENCY_BOT_ID && startsWith(github.event.pull_request.head.ref, 'renovate/')) }}
        run: node tools/ci-plan.mts
      - name: Validate CI routing and Wiki links
        run: |
          node --test tools/ci-plan.test.mts tools/release-checks.test.mts
          node tools/wiki.mts

  go-lint:
    name: Go static checks and vectors (AK9)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-lint-${{ runner.os }}-
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: golangci-lint
      - run: go mod verify
      - run: go mod tidy -diff
      - run: go build ./...
      - run: GOOS=darwin go vet ./...
      - name: go fix (modernize)
        run: go fix -diff ./...
      - name: golangci-lint with the formatters, the binary from mise.lock
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: The Go core regenerates exactly the committed vectors, which the TypeScript job tests against (AK9)
        run: |
          go run ./cmd/nylzo-vectors -out spec/vectors.json
          git diff --exit-code -- spec/vectors.json
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  sca:
    name: Dependency vulnerabilities, malware, and licenses
    needs: changes
    if: needs.changes.outputs.sca == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # verify exact security-fix package-age exceptions
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: go node pnpm osv-scanner
      - run: node tools/security/install-web.mts
        env:
          GH_TOKEN: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && ((github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.id == 49699333) || (github.event.pull_request.user.login == 'nylzo-dependency-updates[bot]' && github.event.pull_request.user.id == vars.DEPENDENCY_BOT_ID)))) && github.token || '' }}
      - run: node tools/sca/scan.mts .sca-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('.sca-reports/source.json') != ''
        with:
          name: dependency-security-reports
          path: .sca-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  repository:
    name: Workflows and scripts
    needs: changes
    if: needs.changes.outputs.repository == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: actionlint zizmor shellcheck node go
      - name: Verify the release tooling installation and audit its locked dependencies
        run: |
          npm ci --prefix tools/release --ignore-scripts --no-audit --no-fund
          npm audit --prefix tools/release --audit-level=moderate
      - name: Check every repository tool's syntax before executing it
        run: git ls-files -z 'tools/*.mts' 'tools/**/*.mts' | xargs -0 -n 1 node --check
      - run: node --test tools/build-info.test.mts tools/security/*.test.mts tools/release/*.test.mts tools/dependencies/*.test.mts tools/coverage/*.test.mts tools/sca/*.test.mts tools/deploy/*.test.mts
      - run: actionlint
      - run: zizmor --persona pedantic .github/workflows
      - run: shellcheck tools/release/wait-publication mise-tasks/dev mise-tasks/release/* mise-tasks/deploy tools/security/scan-release tools/security/verify-tag tools/security/bootstrap-policy tools/security/verify-keyless-tag deploy/hetzner-flatcar/bootstrap/boot deploy/hetzner-flatcar/bootstrap/install deploy/hetzner-flatcar/runtime/{run,prepare,health,host-policy,host-status,recover-os,install-tools,update,release-policy,refresh-tools,clean,bandwidth} tools/deploy/{validate,vm-test,vm-acceptance,image-vm-test}

  deployment:
    name: Flatcar provisioning and reboot acceptance
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: go node opentofu
      - run: tools/deploy/validate
      - name: Install the virtual-machine test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 qemu-utils bzip2 gnupg cpio
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - run: tools/deploy/image-vm-test
      - run: tools/deploy/vm-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: flatcar-acceptance-logs
          path: .deploy/**/*.log
          include-hidden-files: true
          retention-days: 7

  go-test:
    name: Go tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [core, vectors, rest]
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ matrix.shard }}-${{ runner.os }}-
      - name: go test -race
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            core) packages=(./internal/core) ;;
            vectors) packages=(./internal/core/vectors) ;;
            rest) mapfile -t packages < <(go list ./... | grep -v -e '/internal/core$' -e '/internal/core/vectors$') ;;
          esac
          mkdir -p .coverage
          go test -race -covermode=atomic -coverpkg=./... -coverprofile=".coverage/go-${SHARD}.out" -count=1 -shuffle=on -skip '^(TestAK21UniformNotFoundAndConflict|TestAK22SlowConnectionsAndLyingContentLength)$' "${packages[@]}"
          go tool cover -func ".coverage/go-${SHARD}.out" | tail -1 >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html ".coverage/go-${SHARD}.out" -o ".coverage/go-${SHARD}.html"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go-${{ matrix.shard }}
          path: .coverage/go-${{ matrix.shard }}.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  go-timing:
    name: Go timing tests (AK21, AK22)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-rest-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-rest-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-rest-${{ runner.os }}-
      - name: AK21 timing on its own
        run: go test -race -count=1 -run '^TestAK21UniformNotFoundAndConflict$' ./internal/server/
      - name: AK22 slow connections on their own
        run: go test -race -count=1 -run '^TestAK22SlowConnectionsAndLyingContentLength$' ./internal/server/

  fuzz:
    name: Fuzz smoke
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Fuzz each target for 15 s
        run: |
          for target in FuzzOpenPlaintext FuzzOpen FuzzDecodeMeta FuzzParseLink FuzzParseFragment; do
            go test -run='^$' -fuzz="^${target}\$" -fuzztime=15s ./internal/core
          done
          go test -run='^$' -fuzz='^FuzzCreateHeader$' -fuzztime=15s ./internal/server

  web:
    name: TypeScript core and web client
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # verify exact security-fix package-age exceptions
    defaults:
      run:
        working-directory: web
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Supply-chain policy
        run: |
          awk '/^minimumReleaseAge:/ { found = ($2 + 0 >= 1440) } END { exit !found }' pnpm-workspace.yaml
          grep -Eq '^strictDepBuilds: *true$' pnpm-workspace.yaml
          grep -Eq '^allowBuilds: *\{\}$' pnpm-workspace.yaml
          test -f pnpm-lock.yaml
      - run: node ../tools/security/install-web.mts
        env:
          GH_TOKEN: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && ((github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.id == 49699333) || (github.event.pull_request.user.login == 'nylzo-dependency-updates[bot]' && github.event.pull_request.user.id == vars.DEPENDENCY_BOT_ID)))) && github.token || '' }}
      - run: pnpm audit --audit-level=moderate
      - name: Prettier, ESLint and knip
        run: pnpm lint
      - run: pnpm -r typecheck
      - name: Clean svelte-autofixer
        run: pnpm --filter @nylzo/web check
      - run: pnpm --filter @nylzo/core --filter @nylzo/web test --coverage
        env:
          NYLZO_HEAVY_TESTS: "1"
      - name: Preserve repository-relative source paths
        working-directory: .
        run: |
          mkdir -p .coverage
          node tools/coverage/normalize.mts web/core web/core/coverage/lcov.info .coverage/typescript-core.info
          node tools/coverage/normalize.mts web/app web/app/coverage/lcov.info .coverage/web-client.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-typescript
          path: |
            .coverage/*.info
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-coverage-html
          path: |
            web/core/coverage/
            web/app/coverage/
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Coverage reports
    needs: [changes, go-test, web]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.coverage == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true') &&
      (needs.changes.outputs.go != 'true' || needs.go-test.result == 'success') &&
      (needs.changes.outputs.web != 'true' || needs.web.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # authenticate coverage uploads without a persistent Codecov token
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: reports
          merge-multiple: true
          digest-mismatch: error
      - name: Upload Go coverage
        if: >-
          needs.changes.outputs.go == 'true' && github.repository == 'misaon/nylzo' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          # renovate: datasource=github-releases depName=codecov/codecov-cli
          version: v11.3.1
          url: https://codecov.io
          slug: ${{ github.repository }}
          override_commit: ${{ github.sha }}
          override_branch: ${{ github.head_ref || github.ref_name }}
          override_pr: ${{ github.event.pull_request.number || '' }}
          files: reports/go-core.out,reports/go-vectors.out,reports/go-rest.out
          flags: go
          disable_search: true
          fail_ci_if_error: false
      - name: Upload TypeScript coverage
        if: >-
          needs.changes.outputs.web == 'true' && github.repository == 'misaon/nylzo' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          # renovate: datasource=github-releases depName=codecov/codecov-cli
          version: v11.3.1
          url: https://codecov.io
          slug: ${{ github.repository }}
          override_commit: ${{ github.sha }}
          override_branch: ${{ github.head_ref || github.ref_name }}
          override_pr: ${{ github.event.pull_request.number || '' }}
          files: reports/typescript-core.info,reports/web-client.info
          flags: typescript
          disable_search: true
          fail_ci_if_error: false

  dependency-review:
    name: Dependency review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  e2e:
    name: Web client end to end (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # verify exact security-fix package-age exceptions
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            runner: ubuntu-latest
            install: --only-shell chromium
          - browser: firefox
            runner: ubuntu-latest
            install: firefox
          - browser: webkit
            runner: macos-26-intel
            install: webkit
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the client that nylzo embeds
        env:
          GH_TOKEN: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && ((github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.id == 49699333) || (github.event.pull_request.user.login == 'nylzo-dependency-updates[bot]' && github.event.pull_request.user.id == vars.DEPENDENCY_BOT_ID)))) && github.token || '' }}
        working-directory: web
        run: |
          node ../tools/security/install-web.mts
          pnpm --filter @nylzo/web build
      - name: Use the upstream Ubuntu mirror for browser dependencies
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\n' | sudo tee /etc/apt/apt.conf.d/80nylzo-ci > /dev/null
      - name: Install Linux browser libraries
        if: runner.os == 'Linux'
        working-directory: web/e2e
        timeout-minutes: 10
        env:
          BROWSER: ${{ matrix.browser }}
        run: pnpm exec playwright install-deps "$BROWSER"
      - name: Install the Playwright browser
        working-directory: web/e2e
        timeout-minutes: 15
        env:
          INSTALL: ${{ matrix.install }}
        run: |
          limit=()
          if command -v timeout > /dev/null; then limit=(timeout --kill-after=15s 120); fi
          read -ra install <<< "$INSTALL"
          for attempt in 1 2 3; do
            "${limit[@]}" pnpm exec playwright install "${install[@]}" && exit 0
            echo "browser install attempt $attempt failed or hung"
          done
          exit 1
      - name: ${{ matrix.browser }} against nylzo
        working-directory: web/e2e
        env:
          BROWSER: ${{ matrix.browser }}
        run: pnpm e2e --project="$BROWSER"
      - name: Keep the Playwright results of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.browser }}
          path: web/e2e/test-results
          retention-days: 7

  dev-setup:
    name: Developer setup (mise)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # verify exact security-fix package-age exceptions
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          cache: true
      - name: Inventory tools and block vulnerable tool upgrades
        env:
          DEPENDENCY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUTOMATED_PROPOSAL: ${{ github.event.pull_request.user.id == vars.DEPENDENCY_BOT_ID && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'renovate/') }}
        run: |
          mode=--inventory
          if [[ "$AUTOMATED_PROPOSAL" = true ]]; then mode=--candidate; fi
          node tools/dependencies/scan-tools.mts . "$RUNNER_TEMP/tool-vulnerability-reports" "$mode"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tool-vulnerability-reports
          path: ${{ runner.temp }}/tool-vulnerability-reports
          if-no-files-found: error
          retention-days: 14
      - name: mise pins match go.mod, web/.node-version, packageManager, GoReleaser and the tools CI runs
        run: |
          test "go$(mise current go)" = "$(awk '$1 == "toolchain" { print $2 }' go.mod)"
          test "$(mise current node)" = "$(cat web/.node-version)"
          test "pnpm@$(mise current pnpm)" = "$(jq -r .packageManager web/package.json)"
          for workflow in .github/workflows/ci.yml .github/workflows/release.yml; do
            versions=$(yq -r '[.jobs[].steps[]? | select(.uses // "" | test("^goreleaser/goreleaser-action@")) | .with.version // "missing"] | .[]' "$workflow")
            test -n "$versions"
            for version in $versions; do test "$version" = "v$(mise current goreleaser)"; done
          done
          tools=$(grep -o 'go run [a-z0-9./-]*@v[0-9][0-9.]*' mise.toml | cut -d' ' -f3 | sort -u)
          test -n "$tools"
          for tool in $tools; do
            grep -qF "go run $tool" .github/workflows/ci.yml || { echo "mise.toml runs $tool, CI does not"; exit 1; }
          done
      - run: mise run build
        env:
          GH_TOKEN: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && ((github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.id == 49699333) || (github.event.pull_request.user.login == 'nylzo-dependency-updates[bot]' && github.event.pull_request.user.id == vars.DEPENDENCY_BOT_ID)))) && github.token || '' }}
      - name: mise run dev serves the built client
        env:
          GH_TOKEN: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && ((github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.id == 49699333) || (github.event.pull_request.user.login == 'nylzo-dependency-updates[bot]' && github.event.pull_request.user.id == vars.DEPENDENCY_BOT_ID)))) && github.token || '' }}
        run: |
          mise run dev > dev.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8080/healthz > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/healthz > /dev/null || { cat dev.log; exit 1; }
          curl -sf http://127.0.0.1:8080/ | grep -q 'src="/assets/index-' || { cat dev.log; exit 1; }
          test "$(stat -c %a .dev/pepper)" = 600
          pkill -f 'bin/nylzo serve'

  compose:
    name: Compose with Caddy (AK12, AK17, AK26)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # verify exact security-fix package-age exceptions
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the web client that nylzo embeds
        env:
          GH_TOKEN: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && ((github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.id == 49699333) || (github.event.pull_request.user.login == 'nylzo-dependency-updates[bot]' && github.event.pull_request.user.id == vars.DEPENDENCY_BOT_ID)))) && github.token || '' }}
        working-directory: web
        run: |
          node ../tools/security/install-web.mts
          pnpm --filter @nylzo/web build
      - name: Build nylzo and an image laid out like the release image
        run: |
          CGO_ENABLED=0 go build -trimpath -o dist/nylzo ./cmd/nylzo
          go build -o dist/tlscheck ./tools/tlscheck
          base=$(yq -e -r '.kos[0].base_image' .goreleaser.yaml)
          printf 'FROM %s\nCOPY nylzo /ko-app/nylzo\nENTRYPOINT ["/ko-app/nylzo"]\n' "$base" | docker build -q -t nylzo:ci -f - dist
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: grype
      - name: The production image has no high or critical known vulnerabilities
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
          GRYPE_DB_VALIDATE_AGE: "true"
          GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 48h
        run: grype docker:nylzo:ci --fail-on high --output json --file grype-compose.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('grype-compose.json') != ''
        with:
          name: compose-vulnerability-report
          path: grype-compose.json
          if-no-files-found: error
          retention-days: 14
      - name: Start the Compose example for localhost
        working-directory: deploy/compose
        run: |
          mkdir -p secrets
          openssl rand -hex 32 > secrets/pepper
          sudo chown 65532:65532 secrets/pepper
          sudo chmod 0400 secrets/pepper
          report_key=$(../../dist/nylzo report-key --key-file "$RUNNER_TEMP/report-key" | cut -d= -f2-)
          printf 'NYLZO_DOMAIN=localhost\nNYLZO_IMAGE=nylzo:ci\nNYLZO_REPORT_KEY=%s\n' "$report_key" > .env
          docker compose up -d
          for _ in $(seq 1 60); do
            docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/root.crt" 2> /dev/null && curl -sf --cacert "$RUNNER_TEMP/root.crt" https://localhost/healthz > /dev/null && break
            sleep 1
          done
          curl -sf --cacert "$RUNNER_TEMP/root.crt" https://localhost/healthz || { docker compose logs; exit 1; }
      - name: A 5 MiB file goes through Caddy and back (AK17)
        env:
          SSL_CERT_FILE: ${{ runner.temp }}/root.crt
        run: |
          head -c 5242880 /dev/urandom > "$RUNNER_TEMP/file.bin"
          link=$(dist/nylzo create --server https://localhost --from-file "$RUNNER_TEMP/file.bin" < /dev/null)
          out=$(mktemp -d)
          printf '%s' "$link" | dist/nylzo read --out "$out" > /dev/null
          cmp "$RUNNER_TEMP/file.bin" "$out"/nylzo-*/file.bin
      - name: Caddy negotiates X25519MLKEM768 (AK26)
        run: dist/tlscheck -addr localhost:443 -ca "$RUNNER_TEMP/root.crt"
      - name: The web client arrives through Caddy unchanged
        env:
          SSL_CERT_FILE: ${{ runner.temp }}/root.crt
        run: dist/nylzo verify-client --server https://localhost
      - name: Caddy logs nothing about a request that fails (spec §10)
        working-directory: deploy/compose
        run: |
          docker compose stop nylzo
          id=$(head -c 16 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')
          code=$(curl -s -o /dev/null -w '%{http_code}' --cacert "$RUNNER_TEMP/root.crt" -H 'X-Nylzo-Lease: lease-that-must-not-be-logged' "https://localhost/m/$id")
          test "$code" = 502
          sleep 2
          docker compose logs caddy > "$RUNNER_TEMP/caddy.log" 2>&1
          if grep -F -e "$id" -e '/m/' -e 'lease-that-must-not-be-logged' "$RUNNER_TEMP/caddy.log"; then exit 1; fi
          docker compose start nylzo
      - name: A spoofed X-Forwarded-For gets no bucket of its own (AK12)
        working-directory: deploy/compose
        run: |
          printf 'services:\n  nylzo:\n    environment:\n      NYLZO_RATE_SOURCE_RPS: "0.001"\n      NYLZO_RATE_SOURCE_BURST: "3"\n' > compose.ak12.yaml
          docker compose -f compose.yaml -f compose.ak12.yaml up -d nylzo
          for _ in $(seq 1 30); do curl -sf --cacert "$RUNNER_TEMP/root.crt" https://localhost/healthz > /dev/null && break; sleep 1; done
          for i in 1 2 3 4; do
            curl -s -o /dev/null -w '%{http_code}\n' --cacert "$RUNNER_TEMP/root.crt" -H "X-Forwarded-For: 10.0.0.$i" https://localhost/api/v1/instance
          done | tee "$RUNNER_TEMP/codes.txt"
          test "$(tr '\n' ' ' < "$RUNNER_TEMP/codes.txt")" = "200 200 200 429 "
          other=$(hostname -I | awk '{print $1}')
          code=$(curl -s -o /dev/null -w '%{http_code}' --cacert "$RUNNER_TEMP/root.crt" --resolve "localhost:443:${other}" https://localhost/api/v1/instance)
          echo "a second real source: $code"
          test "$code" = 200
      - name: Logs of a failed run
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs

  build:
    name: Release build on ${{ matrix.runner }}
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # verify exact security-fix package-age exceptions
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - name: Release configuration and a snapshot build
        env:
          GH_TOKEN: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && ((github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.id == 49699333) || (github.event.pull_request.user.login == 'nylzo-dependency-updates[bot]' && github.event.pull_request.user.id == vars.DEPENDENCY_BOT_ID)))) && github.token || '' }}
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.18.3
          args: release --snapshot --skip=publish,sign,sbom,ko --clean
      - name: Archive ownership is independent of the build host
        run: |
          python3 - <<'PY'
          import pathlib
          import tarfile

          archives = list(pathlib.Path("dist").glob("*.tar.gz"))
          assert len(archives) == 4, archives
          for archive in archives:
              with tarfile.open(archive) as contents:
                  for member in contents:
                      ownership = (member.uid, member.gid, member.uname, member.gname)
                      assert ownership == (0, 0, "root", "root"), (archive, member.name, ownership)
          PY
      - name: The binary and embedded client carry the same build identity
        run: |
          architecture=amd64
          if [ "$(uname -m)" = aarch64 ]; then architecture=arm64; fi
          binary=(dist/nylzo_linux_"${architecture}"_*/nylzo)
          "${binary[0]}" version --json | cmp - internal/server/web/dist/assets/build-info.json
      - run: sha256sum dist/*/nylzo dist/*/nylzo.exe dist/*.tar.gz dist/*.zip internal/server/web/dist/index.html internal/server/web/dist/assets/* > hashes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-${{ matrix.runner }}
          path: hashes.txt
          retention-days: 7

  reproducible:
    name: Reproducible build (AK15)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, build]
    if: needs.changes.outputs.integration == 'true'
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hashes-*
      - name: Both runners built the same bytes
        run: |
          cat hashes-ubuntu-24.04/hashes.txt
          diff hashes-ubuntu-24.04/hashes.txt hashes-ubuntu-24.04-arm/hashes.txt

  codeql-go:
    name: Analyze (go)
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # let CodeQL inspect the current workflow run
      security-events: write # upload CodeQL findings, including fork PR results
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
