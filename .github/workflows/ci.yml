name: ci

on:
  push:
    branches: [main, "release/v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.plan.outputs.go }}
      web: ${{ steps.plan.outputs.web }}
      integration: ${{ steps.plan.outputs.integration }}
      repository: ${{ steps.plan.outputs.repository }}
      deployment: ${{ steps.plan.outputs.deployment }}
      dependencies: ${{ steps.plan.outputs.dependencies }}
      actions: ${{ steps.plan.outputs.actions }}
      full: ${{ steps.plan.outputs.full }}
      sca: ${{ steps.plan.outputs.sca }}
      coverage: ${{ steps.plan.outputs.coverage }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: bun
      - id: plan
        name: Select checks from the complete changed-file list
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          TRUSTED_COVERAGE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          FORCE_FULL_VERIFICATION: ${{ startsWith(github.ref, 'refs/heads/release/v') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.id == vars.DEPENDENCY_BOT_ID && startsWith(github.event.pull_request.head.ref, 'renovate/')) }}
        run: bun tools/ci-plan.mts
      - name: Validate CI routing and Wiki links
        run: |
          bun test --parallel --timeout 300000 tools/ci-plan.test.mts tools/release-checks.test.mts
          bun tools/wiki.mts

  go:
    name: Go checks and race tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: go golangci-lint
      - run: tools/verify-go-toolchain
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          scope: checks
      - name: Modules, build, vet, go fix, golangci-lint and govulncheck
        id: lint
        run: mise run lint:go
      - name: Race tests with coverage, then the timing tests alone
        if: success() || steps.lint.conclusion == 'failure'
        run: |
          mise run test:go
          go tool cover -func .coverage/go.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html .coverage/go.out -o .coverage/go.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: .coverage/go.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - if: steps.go-cache.outputs.hit != 'true'
        uses: $/.github/actions/go-cache
        with:
          scope: checks
          save: "true"

  sca:
    name: Dependency vulnerabilities, malware, and licenses
    needs: changes
    if: needs.changes.outputs.sca == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Dependency review
        if: github.event_name == 'pull_request' && needs.changes.outputs.dependencies == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: go bun osv-scanner
      - run: tools/verify-go-toolchain
      - name: Known vulnerabilities, malware and licenses of the locked dependencies, with the source SBOM
        run: mise run lint:dependencies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('.sca-reports/source.json') != ''
        with:
          name: dependency-security-reports
          path: .sca-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  repository:
    name: Workflows and scripts
    needs: [changes, sca]
    if: needs.changes.outputs.repository == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: aqua:rhysd/actionlint zizmor shellcheck bun go
      - run: tools/verify-go-toolchain
      - name: Audit and lint the automation, check tool syntax, Wiki links, workflows and shell scripts
        run: mise run lint:repository
      - name: Test the automation and the repository tools
        run: mise run test:repository

  deployment:
    name: Flatcar provisioning and reboot acceptance
    needs: [changes, sca]
    if: needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
      attestations: read # the runner reads the initial release's provenance for the VM
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: go bun opentofu
      - run: tools/verify-go-toolchain
      - run: tools/deploy/validate
      - name: Install the virtual-machine test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 qemu-utils bzip2 gnupg cpio tang jose
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Two Tang servers for the encrypted data volume
        id: tang
        run: |
          servers='[]'
          for port in 7500 7501; do
            sudo mkdir -p "/var/lib/tang-$port"
            sudo /usr/libexec/tangd-keygen "/var/lib/tang-$port"
            signing=$(sudo grep -l '"sign"' "/var/lib/tang-$port"/*.jwk)
            thumbprint=$(sudo jose jwk thp -a S256 -i "$signing")
            sudo systemd-run --unit "tang-$port" systemd-socket-activate --inetd --accept --listen "0.0.0.0:$port" /usr/libexec/tangd "/var/lib/tang-$port"
            servers=$(jq -c --arg url "http://10.0.2.2:$port" --arg thumbprint "$thumbprint" '. + [{url: $url, thumbprint: $thumbprint}]' <<< "$servers")
          done
          for port in 7500 7501; do curl --fail --silent --retry 5 --retry-connrefused "http://127.0.0.1:$port/adv" > /dev/null; done
          echo "configuration=$(jq -c '{threshold: 2, servers: .}' <<< "$servers")" >> "$GITHUB_OUTPUT"
      - name: Install from the Hetzner image and boot the runtime twice, in two VMs at once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NYLZO_VM_TANG: ${{ steps.tang.outputs.configuration }}
        run: |
          set -o pipefail
          (tools/deploy/image-vm-test 2>&1 | sed -u 's/^/image-vm-test | /') &
          image=$!
          (tools/deploy/vm-test 2>&1 | sed -u 's/^/vm-test | /') &
          runtime=$!
          status=0
          wait "$image" || status=$?
          wait "$runtime" || status=$?
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: flatcar-acceptance-logs
          path: .deploy/**/*.log
          include-hidden-files: true
          retention-days: 7

  fuzz:
    name: Fuzz smoke
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: go
      - run: tools/verify-go-toolchain
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          scope: fuzz
      - name: Fuzz each target for 15 s
        run: |
          for target in FuzzOpenPlaintext FuzzCompressedAttachment FuzzOpen FuzzDecodeMeta; do
            go test -run='^$' -fuzz="^${target}\$" -fuzztime=15s ./internal/core/envelope
          done
          go test -run='^$' -fuzz='^FuzzParseLink$' -fuzztime=15s ./internal/core
          go test -run='^$' -fuzz='^FuzzCreateHeader$' -fuzztime=15s ./internal/server
      - if: steps.go-cache.outputs.hit != 'true'
        uses: $/.github/actions/go-cache
        with:
          scope: fuzz
          save: "true"

  web:
    name: TypeScript core and web client
    needs: [changes, sca]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: bun
      - name: Supply-chain policy, audit, Oxfmt, Oxlint, knip, type checks and svelte-autofixer
        run: mise run lint:web
      - name: Install Chromium for browser compression semantics
        run: bun run --cwd web/core --bun playwright install --with-deps chromium
      - name: TypeScript core and web client tests with coverage
        run: mise run test:web
      - name: Preserve repository-relative source paths
        run: |
          mkdir -p .coverage
          bun tools/coverage/normalize.mts web/core web/core/coverage/lcov.info .coverage/typescript-core.info
          bun tools/coverage/normalize.mts web/app web/app/coverage/lcov.info .coverage/web-client.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-typescript
          path: |
            .coverage/*.info
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-coverage-html
          path: |
            web/core/coverage/
            web/app/coverage/
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Coverage reports
    needs: [changes, go, web]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.coverage == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true') &&
      (needs.changes.outputs.go != 'true' || needs.go.result == 'success') &&
      (needs.changes.outputs.web != 'true' || needs.web.result == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # authenticate coverage uploads without a persistent Codecov token
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        env:
          # The bundled unzip stream still calls the deprecated Buffer(); actions/download-artifact issue 484.
          NODE_OPTIONS: --no-deprecation
        with:
          pattern: coverage-*
          path: reports
          merge-multiple: true
          digest-mismatch: error
      - name: Upload Go coverage
        if: needs.changes.outputs.go == 'true' && github.repository == 'misaon/nylzo'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          # renovate: datasource=github-releases depName=codecov/codecov-cli
          version: v11.3.2
          url: https://codecov.io
          slug: ${{ github.repository }}
          override_commit: ${{ github.sha }}
          override_branch: ${{ github.head_ref || github.ref_name }}
          override_pr: ${{ github.event.pull_request.number || '' }}
          files: reports/go.out
          flags: go
          disable_search: true
          plugins: noop
          fail_ci_if_error: false
      - name: Upload TypeScript coverage
        if: needs.changes.outputs.web == 'true' && github.repository == 'misaon/nylzo'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          # renovate: datasource=github-releases depName=codecov/codecov-cli
          version: v11.3.2
          url: https://codecov.io
          slug: ${{ github.repository }}
          override_commit: ${{ github.sha }}
          override_branch: ${{ github.head_ref || github.ref_name }}
          override_pr: ${{ github.event.pull_request.number || '' }}
          files: reports/typescript-core.info,reports/web-client.info
          flags: typescript
          disable_search: true
          plugins: noop
          fail_ci_if_error: false

  e2e:
    name: Web client end to end (${{ matrix.browser }})
    needs: [changes, sca]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            runner: ubuntu-26.04
          - browser: firefox
            runner: ubuntu-26.04
          - browser: webkit
            runner: macos-26
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: go bun
      - run: tools/verify-go-toolchain
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          scope: e2e
      - name: Build the client that nylzo embeds
        run: mise run build:web
      - name: Use the upstream Ubuntu mirror for browser dependencies
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\n' | sudo tee /etc/apt/apt.conf.d/80nylzo-ci > /dev/null
      - name: Install Linux browser libraries
        if: runner.os == 'Linux'
        working-directory: web/e2e
        timeout-minutes: 10
        env:
          BROWSER: ${{ matrix.browser }}
        run: bun --bun playwright install-deps "$BROWSER"
      - name: Install the Playwright browser
        working-directory: web/e2e
        timeout-minutes: 15
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          limit=()
          if command -v timeout > /dev/null; then limit=(timeout --kill-after=15s 120); fi
          for attempt in 1 2 3; do
            "${limit[@]}" bun --bun playwright install "$BROWSER" && exit 0
            echo "browser install attempt $attempt failed or hung"
          done
          exit 1
      - name: ${{ matrix.browser }} against nylzo
        working-directory: web/e2e
        env:
          BROWSER: ${{ matrix.browser }}
        run: bun run e2e --project="$BROWSER"
      # Chromium and Firefox build the same server on the same runner image.
      - if: steps.go-cache.outputs.hit != 'true' && matrix.browser != 'firefox'
        uses: $/.github/actions/go-cache
        with:
          scope: e2e
          save: "true"
      - name: Keep the Playwright results of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            web/e2e/test-results
            web/e2e/server-logs
          retention-days: 7

  dev-setup:
    name: Developer setup (mise)
    needs: [changes, sca]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/mise
      - run: tools/verify-go-toolchain
      - name: Block updates that add high or critical vulnerabilities; pushes also inventory unchanged tools
        env:
          DEPENDENCY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          SCAN_SCOPE: ${{ github.event_name == 'pull_request' && 'changed' || 'all' }}
        run: |
          scope=()
          if [ "$SCAN_SCOPE" = changed ]; then scope=(--changed-only); fi
          bun install --cwd automation --frozen-lockfile --prod --ignore-scripts
          bun automation/vulnerability-scan/gate.ts --base "$DEPENDENCY_BASE_SHA" --reports "$RUNNER_TEMP/tool-vulnerability-reports" "${scope[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tool-vulnerability-reports
          path: ${{ runner.temp }}/tool-vulnerability-reports
          if-no-files-found: error
          retention-days: 14
      - name: mise pins match go.mod, Bun packageManager and GoReleaser, and CI runs every mise check
        run: |
          test "go$(mise current go)" = "$(awk '$1 == "toolchain" { print $2 }' go.mod)"
          test "go$(mise current go)" = "$(awk '$1 == "toolchain" { print $2 }' deploy/caddy/go.mod)"
          test "bun@$(mise current bun)" = "$(jq -r .packageManager web/package.json)"
          for workflow in .github/workflows/ci.yml .github/workflows/release.yml; do
            versions=$(yq -r '[.jobs[].steps[]? | select(.uses // "" | test("^goreleaser/goreleaser-action@")) | .with.version // "missing"] | .[]' "$workflow")
            test -n "$versions"
            for version in $versions; do test "$version" = "v$(mise current goreleaser)"; done
          done
          tasks=$(mise tasks ls --json | jq -r '.[].name | select(test("^(lint|test):"))')
          test -n "$tasks"
          for task in $tasks; do
            grep -qE "mise run ${task}\$" .github/workflows/ci.yml || { echo "mise.toml defines $task, CI does not run it"; exit 1; }
          done
      - run: mise run build
      - name: mise run dev serves the built client
        run: |
          mise run dev > dev.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8080/healthz > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/healthz > /dev/null || { cat dev.log; exit 1; }
          curl -sf http://127.0.0.1:8080/ | grep -q 'src="/assets/index-' || { cat dev.log; exit 1; }
          test "$(stat -c %a .dev/pepper)" = 600
          pkill -f 'bin/nylzo serve'

  compose:
    name: Compose with Caddy
    needs: [changes, sca]
    if: needs.changes.outputs.integration == 'true'
    # Caddy accepts only X25519MLKEM768, so the probes need OpenSSL 3.5 or newer.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: go bun grype
      - run: tools/verify-go-toolchain
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          scope: compose
      - name: Build the web client that nylzo embeds
        run: mise run build:web
      - name: Build nylzo, Caddy and images laid out like the release images
        run: |
          bun tools/build.mts dist/nylzo
          CGO_ENABLED=0 go -C deploy/caddy build -trimpath -buildvcs=false -tags="$(cat deploy/caddy/build-tags)" -ldflags='-s -w' -o ../../dist/caddy .
          go build -o dist/tlscheck ./tools/tlscheck
          base=$(yq -e -r '.kos[0].base_image' .goreleaser.yaml)
          printf 'FROM %s\nCOPY nylzo /ko-app/nylzo\nENTRYPOINT ["/ko-app/nylzo"]\n' "$base" | docker build -q -t nylzo:ci -f - dist
          printf 'FROM %s\nCOPY caddy /ko-app/caddy\nUSER 65533:65533\nENTRYPOINT ["/ko-app/caddy"]\n' "$base" | docker build -q -t caddy:ci -f - dist
      - if: steps.go-cache.outputs.hit != 'true'
        uses: $/.github/actions/go-cache
        with:
          scope: compose
          save: "true"
      - name: The production images have no high or critical known vulnerabilities
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
          GRYPE_DB_VALIDATE_AGE: "true"
          GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 48h
        run: |
          status=0
          grype docker:nylzo:ci --fail-on high --output json --file grype-compose.json || status=$?
          grype docker:caddy:ci --fail-on high --output json --file grype-compose-caddy.json || status=$?
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('grype-compose*.json') != ''
        with:
          name: compose-vulnerability-report
          path: grype-compose*.json
          if-no-files-found: error
          retention-days: 14
      - name: Start the Compose example for localhost
        working-directory: deploy/compose
        run: |
          mkdir -p secrets
          openssl rand -hex 32 > secrets/pepper
          sudo chown 65532:65532 secrets/pepper
          sudo chmod 0400 secrets/pepper
          sudo install -d -o 65533 -g 65533 -m 0700 caddy-state
          report_key=$(../../dist/nylzo report-key --key-file "$RUNNER_TEMP/report-key" | cut -d= -f2-)
          printf 'NYLZO_DOMAIN=localhost\nNYLZO_IMAGE=nylzo:ci\nNYLZO_CADDY_IMAGE=caddy:ci\nNYLZO_REPORT_KEY=%s\n' "$report_key" > .env
          docker compose up -d
          for service in nylzo caddy; do
            docker inspect "nylzo-${service}-1" --format '{{.HostConfig.Memory}} {{.HostConfig.PidsLimit}} {{.HostConfig.NanoCpus}} {{json .HostConfig.Ulimits}}' | tee "$RUNNER_TEMP/limits"
            grep -Eq '^[1-9][0-9]* [1-9][0-9]* [1-9][0-9]* .*"Hard":0,"Name":"core","Soft":0' "$RUNNER_TEMP/limits"
          done
          for _ in $(seq 1 60); do
            docker compose cp caddy:/var/lib/caddy/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/root.crt" 2> /dev/null && curl -sf --cacert "$RUNNER_TEMP/root.crt" https://localhost/healthz > /dev/null && break
            sleep 1
          done
          curl -sf --cacert "$RUNNER_TEMP/root.crt" https://localhost/healthz || { docker compose logs; exit 1; }
      - name: A 5 MiB file goes through Caddy and back
        env:
          SSL_CERT_FILE: ${{ runner.temp }}/root.crt
        run: |
          head -c 5242880 /dev/urandom > "$RUNNER_TEMP/file.bin"
          link=$(dist/nylzo create --server https://localhost --from-file "$RUNNER_TEMP/file.bin" < /dev/null)
          out=$(mktemp -d)
          printf '%s' "$link" | dist/nylzo read --out "$out" > /dev/null
          cmp "$RUNNER_TEMP/file.bin" "$out"/nylzo-*/file.bin
      - name: Caddy accepts only TLS 1.3 with X25519MLKEM768
        run: dist/tlscheck -only -addr localhost:443 -ca "$RUNNER_TEMP/root.crt"
      - name: The web client arrives through Caddy unchanged
        env:
          SSL_CERT_FILE: ${{ runner.temp }}/root.crt
        run: dist/nylzo verify-client --server https://localhost
      - name: Caddy logs nothing about a request that fails (spec §10)
        working-directory: deploy/compose
        run: |
          docker compose stop nylzo
          test "$(curl -s -o /dev/null -w '%{http_code}' --cacert "$RUNNER_TEMP/root.crt" https://localhost/r)" = 200
          id=$(head -c 16 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')
          code=$(curl -s -o /dev/null -w '%{http_code}' --cacert "$RUNNER_TEMP/root.crt" -H 'X-Nylzo-Lease: lease-that-must-not-be-logged' "https://localhost/api/v1/messages/$id/blob")
          test "$code" = 502
          sleep 2
          docker compose logs caddy > "$RUNNER_TEMP/caddy.log" 2>&1
          if grep -F -e "$id" -e '/api/v1/messages/' -e 'lease-that-must-not-be-logged' "$RUNNER_TEMP/caddy.log"; then exit 1; fi
          docker compose start nylzo
      - name: A spoofed X-Forwarded-For gets no bucket of its own
        working-directory: deploy/compose
        run: |
          printf 'services:\n  nylzo:\n    environment:\n      NYLZO_RATE_SOURCE_RPS: "0.001"\n      NYLZO_RATE_SOURCE_BURST: "3"\n' > compose.ak12.yaml
          docker compose -f compose.yaml -f compose.ak12.yaml up -d nylzo
          for _ in $(seq 1 30); do curl -sf --cacert "$RUNNER_TEMP/root.crt" https://localhost/healthz > /dev/null && break; sleep 1; done
          for i in 1 2 3 4; do
            curl -s -o /dev/null -w '%{http_code}\n' --cacert "$RUNNER_TEMP/root.crt" -H "X-Forwarded-For: 10.0.0.$i" https://localhost/api/v1/instance
          done | tee "$RUNNER_TEMP/codes.txt"
          test "$(tr '\n' ' ' < "$RUNNER_TEMP/codes.txt")" = "200 200 200 429 "
          other=$(hostname -I | awk '{print $1}')
          code=$(curl -s -o /dev/null -w '%{http_code}' --cacert "$RUNNER_TEMP/root.crt" --resolve "localhost:443:${other}" https://localhost/api/v1/instance)
          echo "a second real source: $code"
          test "$code" = 200
      - name: Logs of a failed run
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs

  build:
    name: Release build on ${{ matrix.runner }}
    needs: [changes, sca]
    if: needs.changes.outputs.integration == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: go bun cosign
          cache: none
      - run: tools/verify-go-toolchain
      - name: Release configuration and a snapshot build
        timeout-minutes: 8
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.19.0
          args: release --snapshot --skip=publish,sign,sbom --clean
      - name: The checksums list every embedded web client file
        run: |
          find internal/server/web/dist -type f -exec sha256sum {} + | sed 's|  .*/|  |' | sort > "${RUNNER_TEMP}/embedded.txt"
          test -s "${RUNNER_TEMP}/embedded.txt"
          missing=$(sort dist/checksums.txt | comm -23 "${RUNNER_TEMP}/embedded.txt" -)
          if [ -n "$missing" ]; then printf 'checksums.txt misses:\n%s\n' "$missing"; exit 1; fi
      - name: Archive ownership is independent of the build host
        run: |
          python3 - <<'PY'
          import pathlib
          import tarfile

          archives = list(pathlib.Path("dist").glob("*.tar.gz"))
          assert len(archives) == 6, archives
          for archive in archives:
              with tarfile.open(archive) as contents:
                  for member in contents:
                      ownership = (member.uid, member.gid, member.uname, member.gname)
                      assert ownership == (0, 0, "root", "root"), (archive, member.name, ownership)
          PY
      - name: The ko images run as their own users and contain the archived binaries
        run: |
          for id in nylzo caddy; do
            image=$(jq -er --arg id "$id" '[.[] | select(.type == "Docker Manifest" and .extra.ID == $id) | .name] | unique | if length == 1 then .[0] else error("expected one \($id) image") end' dist/artifacts.json)
            architecture=$(docker image inspect --format '{{.Architecture}}' "$image")
            user=$(docker image inspect --format '{{.Config.User}}' "$image")
            if [ "$id" = caddy ]; then test "$user" = 65533:65533; else test "$user" = 65532; fi
            container=$(docker create --platform "linux/${architecture}" "$image")
            docker cp "${container}:/ko-app/${id}" "${RUNNER_TEMP}/${id}-image"
            docker rm "$container" > /dev/null
            binary=(dist/"${id}"_linux_"${architecture}"_*/"${id}")
            cmp "${RUNNER_TEMP}/${id}-image" "${binary[0]}"
          done
      - name: The binary and embedded client carry the same build identity
        run: |
          architecture=amd64
          if [ "$(uname -m)" = aarch64 ]; then architecture=arm64; fi
          binary=(dist/nylzo_linux_"${architecture}"_*/nylzo)
          "${binary[0]}" version --json | cmp - internal/server/web/dist/assets/build-info.json
      - run: sha256sum dist/*/nylzo dist/*/nylzo.exe dist/*/caddy dist/*.tar.gz dist/*.zip .host-bundle/*.tar internal/server/web/dist/*.html internal/server/web/dist/*.md internal/server/web/dist/assets/* > hashes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-${{ matrix.runner }}
          path: hashes.txt
          retention-days: 7

  codeql-go:
    name: Analyze (go)
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # let CodeQL inspect the current workflow run
      security-events: write # upload CodeQL findings, including fork PR results
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: go
      - run: tools/verify-go-toolchain
      - id: go-cache
        uses: $/.github/actions/go-cache
        with:
          scope: codeql
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended
          config: |
            threat-models: remote
      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:go
      - if: steps.go-cache.outputs.hit != 'true'
        uses: $/.github/actions/go-cache
        with:
          scope: codeql
          save: "true"

  codeql-web:
    name: Analyze (javascript-typescript)
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # let CodeQL inspect the current workflow run
      security-events: write # upload CodeQL findings, including fork PR results
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            threat-models: remote
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript

  codeql-actions:
    name: Analyze (actions)
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # let CodeQL inspect the current workflow run
      security-events: write # upload CodeQL findings, including fork PR results
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions
          build-mode: none
          queries: security-extended
          config: |
            threat-models: remote
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:actions

  required:
    name: CI required
    if: always()
    needs:
      [
        changes,
        sca,
        go,
        repository,
        deployment,
        fuzz,
        web,
        coverage,
        e2e,
        dev-setup,
        compose,
        build,
        codeql-go,
        codeql-web,
        codeql-actions,
      ]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read # authenticate the independent Socket App result on this PR head
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: bun
      - name: Every planned job completed successfully
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: bun tools/ci-plan.mts check
      - name: Download the hashes of both release builds
        if: needs.changes.outputs.integration == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        env:
          # The bundled unzip stream still calls the deprecated Buffer(); actions/download-artifact issue 484.
          NODE_OPTIONS: --no-deprecation
        with:
          pattern: hashes-*
          path: ${{ runner.temp }}/hashes
          digest-mismatch: error
      - name: Both runners built the same bytes
        if: needs.changes.outputs.integration == 'true'
        run: |
          cat "$RUNNER_TEMP/hashes/hashes-ubuntu-24.04/hashes.txt"
          diff "$RUNNER_TEMP/hashes/hashes-ubuntu-24.04/hashes.txt" "$RUNNER_TEMP/hashes/hashes-ubuntu-24.04-arm/hashes.txt"
      - name: Required Socket scan of the exact PR head
        if: github.event_name == 'pull_request' && github.repository == 'misaon/nylzo'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOCKET_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bun install --cwd automation --frozen-lockfile --prod --ignore-scripts
          bun automation/socket-check/main.ts

  release-verification:
    name: Release verification
    needs: [changes, required]
    if: >-
      always() && needs.changes.outputs.full == 'true' && needs.required.result == 'success' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/v') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.id == vars.DEPENDENCY_BOT_ID && startsWith(github.event.pull_request.head.ref, 'renovate/')))
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - run: echo 'Every source, security, integration, and reproducibility check passed.'
