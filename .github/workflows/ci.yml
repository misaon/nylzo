name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go mod verify
      - run: go mod tidy -diff
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 -skip '^TestAK21UniformNotFoundAndConflict$' ./...
      - name: AK21 timing on its own
        run: go test -race -count=1 -run '^TestAK21UniformNotFoundAndConflict$' ./internal/server/
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    name: TypeScript core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Supply-chain policy
        run: |
          awk '/^minimumReleaseAge:/ { found = 1; if ($2 + 0 < 1440) exit 1 } END { exit !found }' pnpm-workspace.yaml
          grep -Eq '^strictDepBuilds: *true$' pnpm-workspace.yaml
          grep -Eq '^allowBuilds: *\{\}$' pnpm-workspace.yaml
          test -f pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm -r typecheck
      - run: pnpm -r test
        env:
          NYLZO_HEAVY_TESTS: "1"

  vectors:
    name: Cross-check vectors (AK9)
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Regenerate vectors from the Go core
        run: |
          go run ./cmd/nylzo-vectors -out spec/vectors.json
          git diff --exit-code -- spec/vectors.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: TypeScript core against the regenerated vectors
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm -r test
