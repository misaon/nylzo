      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            threat-models: remote
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  codeql-actions:
    name: Analyze (actions)
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # let CodeQL inspect the current workflow run
      security-events: write # upload CodeQL findings, including fork PR results
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none
          queries: security-extended
          config: |
            threat-models: remote
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:actions

  required:
    name: CI required
    if: always()
    needs:
      [
        changes,
        sca,
        go-lint,
        repository,
        deployment,
        go-test,
        go-timing,
        fuzz,
        web,
        coverage,
        dependency-review,
        e2e,
        dev-setup,
        compose,
        build,
        reproducible,
        codeql-go,
        codeql-web,
        codeql-actions,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
      - name: Every planned job completed successfully
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node tools/ci-plan.mts check

  release-verification:
    name: Release verification
    needs: [changes, required]
    if: >-
      always() && needs.changes.outputs.full == 'true' && needs.required.result == 'success' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/v') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.id == vars.DEPENDENCY_BOT_ID && startsWith(github.event.pull_request.head.ref, 'renovate/')))
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo 'Every source, security, integration, and reproducibility check passed.'
