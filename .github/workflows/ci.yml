name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go mod verify
      - run: go mod tidy -diff
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: GOOS=darwin go vet ./...
      - name: go fix (modernize)
        run: go fix -diff ./...
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - run: go build ./...
      - run: go test -race -count=1 -shuffle=on -skip '^(TestAK21UniformNotFoundAndConflict|TestAK22SlowConnectionsAndLyingContentLength)$' ./...
      - name: AK21 timing on its own
        run: go test -race -count=1 -run '^TestAK21UniformNotFoundAndConflict$' ./internal/server/
      - name: AK22 slow connections on their own
        run: go test -race -count=1 -run '^TestAK22SlowConnectionsAndLyingContentLength$' ./internal/server/
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Fuzz each target for 15 s
        run: |
          for target in FuzzOpenPlaintext FuzzOpen FuzzDecodeMeta FuzzParseLink FuzzParseFragment; do
            go test -run='^$' -fuzz="^${target}\$" -fuzztime=15s ./internal/core
          done
          go test -run='^$' -fuzz='^FuzzCreateHeader$' -fuzztime=15s ./internal/server

  web:
    name: TypeScript core and web client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Supply-chain policy
        run: |
          awk '/^minimumReleaseAge:/ { found = 1; if ($2 + 0 < 1440) exit 1 } END { exit !found }' pnpm-workspace.yaml
          grep -Eq '^strictDepBuilds: *true$' pnpm-workspace.yaml
          grep -Eq '^allowBuilds: *\{\}$' pnpm-workspace.yaml
          test -f pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm -r typecheck
      - name: No markup sinks, clean svelte-autofixer
        run: pnpm --filter @nylzo/web check
      - run: pnpm -r test
        env:
          NYLZO_HEAVY_TESTS: "1"

  vectors:
    name: Cross-check vectors (AK9)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [go]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Regenerate vectors from the Go core
        run: |
          go run ./cmd/nylzo-vectors -out spec/vectors.json
          git diff --exit-code -- spec/vectors.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: TypeScript core against the regenerated vectors
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm -r test

  e2e:
    name: Web client end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the client that nylzod embeds
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @nylzo/web build
      - name: Install the Playwright browsers
        working-directory: web/e2e
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Chromium, Firefox and WebKit against nylzod
        working-directory: web/e2e
        run: pnpm e2e
      - name: Keep the Playwright results of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: web/e2e/test-results
          retention-days: 7

  build:
    name: Release build on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - name: Release configuration and a snapshot build
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: build --snapshot --clean
      - run: sha256sum dist/*/nylzod internal/server/web/dist/index.html internal/server/web/dist/assets/* > hashes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hashes-${{ matrix.runner }}
          path: hashes.txt
          retention-days: 7

  reproducible:
    name: Reproducible build (AK15)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hashes-*
      - name: Both runners built the same bytes
        run: |
          cat hashes-ubuntu-24.04/hashes.txt
          diff hashes-ubuntu-24.04/hashes.txt hashes-ubuntu-24.04-arm/hashes.txt
