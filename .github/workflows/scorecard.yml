name: OpenSSF Scorecard

on:
  push:
    branches: [main]
    paths:
      - .github/**
      - SECURITY.md
      - LICENSE
      - go.mod
      - go.sum
      - web/**/package.json
      - web/bun.lock
      - .goreleaser.yaml
      - mise.toml
      - mise.lock
  schedule:
    - cron: "41 6 * * 2"

permissions:
  contents: read

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  analysis:
    if: github.repository == 'misaon/nylzo'
    name: Repository security posture
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # authenticate the published public Scorecard results
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            api.scorecard.dev:443
            fulcio.sigstore.dev:443
            github.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            www.bestpractices.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Publishing is accepted only from a job whose steps all use allowlisted actions, so no run step belongs here.
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: scorecard.sarif
          if-no-files-found: error
          retention-days: 14

  code-scanning:
    name: Scorecard findings in code scanning
    needs: analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      security-events: write # publish the Scorecard report to code scanning
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        env:
          # The bundled unzip stream still calls the deprecated Buffer(); actions/download-artifact issue 484.
          NODE_OPTIONS: --no-deprecation
        with:
          name: scorecard-results
          digest-mismatch: error
      # Repository-wide checks name no file; code scanning needs a valid location, so they point at the README.
      - name: Give repository-wide findings a valid location
        run: |
          jq '(.. | objects | select(.uri? == "no file associated with this alert")).uri = "README.md"' scorecard.sarif > "$RUNNER_TEMP/scorecard.sarif"
          mv "$RUNNER_TEMP/scorecard.sarif" scorecard.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
