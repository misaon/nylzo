name: OpenSSF Scorecard

on:
  push:
    branches: [main]
    paths:
      - .github/**
      - SECURITY.md
      - LICENSE
      - go.mod
      - go.sum
      - web/**/package.json
      - web/bun.lock
      - .goreleaser.yaml
      - mise.toml
      - mise.lock
  schedule:
    - cron: "41 6 * * 2"

permissions:
  contents: read

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  analysis:
    if: github.repository == 'misaon/nylzo'
    name: Repository security posture
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # publish the Scorecard report to code scanning
      id-token: write # authenticate the published public Scorecard results
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      # Repository-wide checks name no file; code scanning needs a valid location, so they point at the README.
      - name: Give repository-wide findings a valid location
        run: |
          jq '(.. | objects | select(.uri? == "no file associated with this alert")).uri = "README.md"' scorecard.sarif > "$RUNNER_TEMP/scorecard.sarif"
          mv "$RUNNER_TEMP/scorecard.sarif" scorecard.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: scorecard.sarif
          if-no-files-found: error
          retention-days: 14
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
