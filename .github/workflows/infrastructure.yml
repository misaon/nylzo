name: Infrastructure
run-name: Infrastructure ${{ inputs.stack || github.event_name }}

on:
  push:
    branches: [main]
    paths:
      - deploy/hetzner-flatcar/infrastructure/**
      - deploy/hetzner-flatcar/toolchain.json
      - tools/deploy/configuration.mts
      - tools/deploy/operator.mts
      - tools/deploy/render.mts
      - tools/deploy/hetzner.mts
  schedule:
    # Drift check: a plan with changes fails, and nothing is applied.
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      stack:
        description: The stack to plan and apply
        type: choice
        options: [server, dns, image]
        default: server
      restore:
        description: Reopen the firewall that the kill switch closed (server stack, after the investigation)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: infrastructure
  cancel-in-progress: false
  # A scheduled drift check must not replace an apply that waits for its turn.
  queue: max

jobs:
  image-check:
    name: A verified image exists for the pinned Flatcar
    if: github.repository == 'misaon/nylzo' && vars.NYLZO_INFRASTRUCTURE_ENABLED == 'true' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment:
      name: infrastructure-plan
      deployment: false
    permissions:
      contents: read
    outputs:
      missing: ${{ steps.check.outputs.missing }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy/hetzner-flatcar/toolchain.json
          sparse-checkout-cone-mode: false
      # A Flatcar update from Renovate needs a new verified image before the server stack can plan.
      - id: check
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          SITE: ${{ secrets.NYLZO_SITE_JSON }}
        run: |
          version=$(jq -er .flatcar deploy/hetzner-flatcar/toolchain.json)
          architecture=$(jq -er .architecture <<< "${SITE}")
          available=$(curl --fail --silent --show-error --proto '=https' --max-time 30 -G \
            -H "Authorization: Bearer ${HCLOUD_TOKEN}" --data-urlencode type=snapshot \
            --data-urlencode "label_selector=nylzo-verified-image=true,nylzo-flatcar-version=${version},nylzo-architecture=${architecture}" \
            https://api.hetzner.cloud/v1/images | jq -e '[.images[] | select(.status == "available")] | length')
          echo "missing=$([[ "${available}" = 0 ]] && echo true || echo false)" >> "${GITHUB_OUTPUT}"

  image:
    needs: image-check
    permissions:
      contents: read
    if: >-
      always() && github.repository == 'misaon/nylzo' && vars.NYLZO_INFRASTRUCTURE_ENABLED == 'true' &&
      (inputs.stack == 'image' || needs.image-check.outputs.missing == 'true')
    uses: $/.github/workflows/infrastructure-stack.yml
    with:
      stack: image
      apply: true

  server:
    needs: image
    permissions:
      contents: read
    if: >-
      always() && github.repository == 'misaon/nylzo' && vars.NYLZO_INFRASTRUCTURE_ENABLED == 'true' &&
      needs.image.result != 'failure' && (github.event_name != 'workflow_dispatch' || inputs.stack == 'server')
    uses: $/.github/workflows/infrastructure-stack.yml
    with:
      stack: server
      apply: ${{ github.event_name != 'schedule' }}
      restore: ${{ inputs.restore == true }}

  dns:
    permissions:
      contents: read
    needs: server
    if: >-
      always() && github.repository == 'misaon/nylzo' && vars.NYLZO_INFRASTRUCTURE_ENABLED == 'true' &&
      needs.server.result != 'failure' && (github.event_name != 'workflow_dispatch' || inputs.stack == 'dns')
    uses: $/.github/workflows/infrastructure-stack.yml
    with:
      stack: dns
      apply: ${{ github.event_name != 'schedule' }}
