name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

env:
  GOTOOLCHAIN: local
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  DEPENDENCY_APP_SLUG: ${{ vars.DEPENDENCY_APP_SLUG }}

jobs:
  guard:
    name: Signed tag on main and protected environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      environment: ${{ steps.tag.outputs.environment }}
    permissions:
      contents: read
      checks: read # require successful CI and CodeQL before building a release
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: gitsign
          cache: false
      - name: Verify the tag name, source, and authorized signing identity
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGGER_EMAIL: ${{ vars.RELEASE_TAGGER_EMAIL }}
          SECURITY_AUTOMATION_ENABLED: ${{ vars.SECURITY_AUTOMATION_ENABLED }}
        run: bash tools/security/verify-tag
      - name: The source commit passed CI and every CodeQL analysis on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash mise-tasks/release/checks "${GITHUB_SHA}"
      - name: The manual release environment requires a reviewer
        if: steps.tag.outputs.environment == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api "repos/${GITHUB_REPOSITORY}/environments/release" --jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] | length')
          test "${reviewers}" -gt 0

  web:
    name: Web client without write access
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.manifest.outputs.sha256 }}
      evidence_manifest: ${{ steps.manifest.outputs.evidence_sha256 }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: go osv-scanner
          cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: node tools/security/install-web.mts
      - name: Check source dependencies and generate the release SBOM and VEX
        env:
          NYLZO_VERSION: ${{ github.ref_name }}
        run: node tools/sca/scan.mts "$RUNNER_TEMP/release-evidence" --sbom
      - name: Build the web client for the exact release tag
        env:
          NYLZO_VERSION: ${{ github.ref_name }}
        run: |
          pnpm --dir web --filter @nylzo/web build
          jq -e --arg version "${GITHUB_REF_NAME#v}" --arg commit "${GITHUB_SHA}" \
            '.version == $version and .commit == $commit and .dirty == false' internal/server/web/dist/assets/build-info.json
      - name: SHA-256 manifest of the build
        id: manifest
        run: |
          mkdir -p "${RUNNER_TEMP}/web-client/evidence"
          version="${GITHUB_REF_NAME#v}"
          cp "$RUNNER_TEMP/release-evidence/source.json" "$RUNNER_TEMP/web-client/evidence/nylzo_${version}.dependency-report.json"
          cp "$RUNNER_TEMP/release-evidence/go-imports.json" "$RUNNER_TEMP/web-client/evidence/nylzo_${version}.go-imports.json"
          cp deploy/hetzner-flatcar/toolchain.json "$RUNNER_TEMP/web-client/evidence/nylzo_${version}.host-tools.json"
          node automation/release-tag/release-policy.ts "$RUNNER_TEMP/web-client/evidence/nylzo_${version}.release-policy.json"
          cp "$RUNNER_TEMP/release-evidence/nylzo_${version}.source.spdx.json" "$RUNNER_TEMP/web-client/evidence/"
          if [ -f "$RUNNER_TEMP/release-evidence/nylzo_${version}.openvex.json" ]; then
            cp "$RUNNER_TEMP/release-evidence/nylzo_${version}.openvex.json" "$RUNNER_TEMP/web-client/evidence/"
          fi
          (cd "$RUNNER_TEMP/web-client/evidence" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/web-client/evidence.sha256"
          echo "evidence_sha256=$(sha256sum < "$RUNNER_TEMP/web-client/evidence.sha256" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          cp -R internal/server/web/dist "${RUNNER_TEMP}/web-client/dist"
          cd "${RUNNER_TEMP}/web-client/dist"
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > ../dist.sha256
          cat ../dist.sha256
          echo "sha256=$(sha256sum < ../dist.sha256 | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-client
          path: ${{ runner.temp }}/web-client
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: [guard, web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ needs.guard.outputs.environment }}
    permissions:
      contents: write # create the GitHub release and upload its files
      packages: write # push the image to ghcr.io
      id-token: write # keyless cosign signatures and provenance
      attestations: write # build provenance attestations
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag still names the commit the guard checked
        run: |
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-client
          path: ${{ runner.temp }}/web-client
          digest-mismatch: error
      - name: The web client matches the manifest of the web job
        env:
          MANIFEST_SHA256: ${{ needs.web.outputs.manifest }}
        run: |
          cd "${RUNNER_TEMP}/web-client"
          test "$(sha256sum < dist.sha256 | cut -d ' ' -f 1)" = "${MANIFEST_SHA256}"
          (cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) | cmp - dist.sha256
          cat dist.sha256
          test ! -e "${GITHUB_WORKSPACE}/internal/server/web/dist"
          cp -R dist "${GITHUB_WORKSPACE}/internal/server/web/dist"
      - name: The dependency evidence matches the readonly web job
        env:
          EXPECTED_EVIDENCE_SHA256: ${{ needs.web.outputs.evidence_manifest }}
        run: |
          cd "$RUNNER_TEMP/web-client"
          test "$(sha256sum < evidence.sha256 | cut -d ' ' -f 1)" = "$EXPECTED_EVIDENCE_SHA256"
          (cd evidence && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) | cmp - evidence.sha256
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # renovate: datasource=github-releases depName=anchore/syft
          syft-version: v1.54.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: grype
          cache: false
      - name: The base image is the one the distroless project signed
        run: |
          test "$(yq '.kos | length' .goreleaser.yaml)" = 1
          base_image=$(yq -e -r '.kos[0].base_image' .goreleaser.yaml)
          printf '%s\n' "${base_image}" | grep -Eqx 'gcr\.io/distroless/static-debian13:nonroot@sha256:[0-9a-f]{64}'
          cosign verify "${base_image}" \
            --certificate-oidc-issuer https://accounts.google.com \
            --certificate-identity keyless@distroless.iam.gserviceaccount.com \
            > /dev/null
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.18.3
          args: release --clean --skip=before
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - name: Digest of the published image
        id: image
        run: |
          test "$(jq -r .tag dist/metadata.json)" = "${GITHUB_REF_NAME}"
          digest=$(jq -r 'first(.[] | select(.type == "Docker Manifest") | .extra.Digest)' dist/artifacts.json)
          test -n "${digest}" && test "${digest}" != null
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Provenance of the archives, checksums and web client files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/misaon/nylzo
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Every supported platform has an archive, SBOM, and signed checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          for platform in linux darwin windows; do
            extension=tar.gz
            if [ "$platform" = windows ]; then extension=zip; fi
            for architecture in amd64 arm64; do
              archive="nylzo_${version}_${platform}_${architecture}.${extension}"
              test -s "dist/${archive}"
              grep -F "${archive}" dist/checksums.txt
              test -s "dist/${archive}.sbom.json"
            done
          done
          test -s dist/checksums.txt.sigstore.json
      - name: The exact candidate passes vulnerability checks before promotion
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: bash tools/security/scan-release "ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}" dist vulnerability-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('vulnerability-reports/*.json') != ''
        with:
          name: release-vulnerability-reports
          path: vulnerability-reports
          if-no-files-found: error
          retention-days: 30
      - name: Sign and upload the dependency report, source SBOM, and VEX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest="$RUNNER_TEMP/web-client/nylzo_${GITHUB_REF_NAME#v}.evidence.sha256"
          cp "$RUNNER_TEMP/web-client/evidence.sha256" "$manifest"
          cosign sign-blob "$manifest" --bundle "${manifest}.sigstore.json" --yes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP/web-client/evidence/"*.json "$manifest" "${manifest}.sigstore.json"
      - name: Provenance of the source SBOM and vulnerability evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/web-client/evidence.sha256
      - name: Promote the verified candidate to its stable image tag
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY}"
          docker buildx imagetools create --tag "${image}:${GITHUB_REF_NAME#v}" "${image}@${IMAGE_DIGEST}"
          test "$(docker buildx imagetools inspect "${image}:${GITHUB_REF_NAME#v}" --format '{{.Manifest.Digest}}')" = "$IMAGE_DIGEST"
      - name: Publish the complete release and lock its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
      - name: Update latest only after the release is published
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$GITHUB_REF_NAME"
          image="ghcr.io/${GITHUB_REPOSITORY}"
          docker buildx imagetools create --tag "${image}:latest" "${image}@${IMAGE_DIGEST}"
          test "$(docker buildx imagetools inspect "${image}:latest" --format '{{.Manifest.Digest}}')" = "$IMAGE_DIGEST"
