name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  guard:
    name: Signed tag on main and protected environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The release tagger signed the tag, which names the built commit on main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAGGER_EMAIL: ${{ vars.RELEASE_TAGGER_EMAIL }}
        run: |
          test -n "${RELEASE_TAGGER_EMAIL}"
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" "+refs/heads/main:refs/remotes/origin/main"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
          tag_sha=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}")
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" > "${RUNNER_TEMP}/tag.json"
          test "$(jq -r .verification.verified "${RUNNER_TEMP}/tag.json")" = true
          test "$(jq -r .tagger.email "${RUNNER_TEMP}/tag.json")" = "${RELEASE_TAGGER_EMAIL}"
      - name: The release environment requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api "repos/${GITHUB_REPOSITORY}/environments/release" --jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] | length')
          test "${reviewers}" -gt 0

  web:
    name: Web client without write access
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - name: The GoReleaser before hooks build the client
        run: yq -e -r '.before.hooks[]' .goreleaser.yaml | while IFS= read -r hook; do sh -c "${hook}" < /dev/null; done
      - name: SHA-256 manifest of the build
        id: manifest
        run: |
          mkdir "${RUNNER_TEMP}/web-client"
          cp -R internal/server/web/dist "${RUNNER_TEMP}/web-client/dist"
          cd "${RUNNER_TEMP}/web-client/dist"
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > ../dist.sha256
          cat ../dist.sha256
          echo "sha256=$(sha256sum < ../dist.sha256 | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-client
          path: ${{ runner.temp }}/web-client
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: [guard, web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag still names the commit the guard checked
        run: |
          git fetch --force --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-client
          path: ${{ runner.temp }}/web-client
          digest-mismatch: error
      - name: The web client matches the manifest of the web job
        env:
          MANIFEST_SHA256: ${{ needs.web.outputs.manifest }}
        run: |
          cd "${RUNNER_TEMP}/web-client"
          test "$(sha256sum < dist.sha256 | cut -d ' ' -f 1)" = "${MANIFEST_SHA256}"
          (cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) | cmp - dist.sha256
          cat dist.sha256
          test ! -e "${GITHUB_WORKSPACE}/internal/server/web/dist"
          cp -R dist "${GITHUB_WORKSPACE}/internal/server/web/dist"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - name: The base image is the one the distroless project signed
        run: |
          test "$(yq '.kos | length' .goreleaser.yaml)" = 1
          base_image=$(yq -e -r '.kos[0].base_image' .goreleaser.yaml)
          printf '%s\n' "${base_image}" | grep -Eqx 'gcr\.io/distroless/static-debian13:nonroot@sha256:[0-9a-f]{64}'
          cosign verify "${base_image}" \
            --certificate-oidc-issuer https://accounts.google.com \
            --certificate-identity keyless@distroless.iam.gserviceaccount.com \
            > /dev/null
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --skip=before
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - name: Digest of the published image
        id: image
        run: |
          test "$(jq -r .tag dist/metadata.json)" = "${GITHUB_REF_NAME}"
          digest=$(jq -r 'first(.[] | select(.type == "Docker Manifest") | .extra.Digest)' dist/artifacts.json)
          test -n "${digest}" && test "${digest}" != null
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Provenance of the archives, checksums and web client files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/misaon/nylzo
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
