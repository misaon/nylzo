name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  BASE_IMAGE: gcr.io/distroless/static-debian13@sha256:d62067879de890a1def9da0e7766b7d20810a5e5555cef8506b752437d7a3e88

jobs:
  guard:
    name: Signed tag and protected environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is annotated and GitHub verified its signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          tag_sha=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}")
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq .verification.verified)" = true
      - name: The release environment requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api "repos/${GITHUB_REPOSITORY}/environments/release" --jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] | length')
          test "${reviewers}" -gt 0

  release:
    name: Release
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1
      - name: The base image is the one the distroless project signed
        run: >-
          cosign verify "${BASE_IMAGE}"
          --certificate-oidc-issuer https://accounts.google.com
          --certificate-identity keyless@distroless.iam.gserviceaccount.com
          > /dev/null
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Digest of the published image
        id: image
        run: |
          digest=$(jq -r 'first(.[] | select(.type == "Docker Manifest") | .extra.Digest)' dist/artifacts.json)
          test -n "${digest}" && test "${digest}" != null
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Provenance of the archives, checksums and web client files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/misaon/nylzo
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
