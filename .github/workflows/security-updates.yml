name: Security updates

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- Executes trusted main tools only; validates API metadata and never downloads or executes PR artifacts.
    workflows: [ci, release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-updates
  cancel-in-progress: false
  queue: max

jobs:
  signing-probe:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'misaon/nylzo'
    name: Verify keyless tag signing without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # test the exact automation signing identity without a persistent signing key
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and isolate the approved automation policy
        run: |
          echo '088961116d9ef913cb4ef1aa3ff2e23f6146d23747ef6818113d5d1a5f9996d8  tools/security/bootstrap-policy' | sha256sum --check
          bash tools/security/bootstrap-policy
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ runner.temp }}/nylzo-security-policy
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: gitsign
          working_directory: ${{ runner.temp }}/nylzo-security-policy
          add_shims_to_path: false
          cache: false
      - name: Sign and verify a local tag; do not push it
        env:
          GITSIGN_TOKEN_PROVIDER: github-actions
        run: |
          gitsign version
          tag="automation-probe-${GITHUB_RUN_ID}"
          git -c user.name='Nylzo security automation' -c user.email='automation@nylzo.com' -c gpg.format=x509 -c gpg.x509.program=gitsign tag -s "$tag" -m 'Local automation signing check'
          git cat-file tag "refs/tags/$tag" > "$RUNNER_TEMP/tag-probe.raw"
          bash "$RUNNER_TEMP/nylzo-security-policy/tools/security/verify-keyless-tag" "$tag" "$GITHUB_SHA" workflow_dispatch

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-signing-probe
          path: ${{ runner.temp }}/tag-probe.raw
          if-no-files-found: warn
          retention-days: 7

  app-probe:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'misaon/nylzo' && github.ref == 'refs/heads/main'
    name: Verify repository-scoped App credentials without writing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: security-automation
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.SECURITY_APP_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
          owner: misaon
          repositories: nylzo
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
      - name: Only this repository is accessible and CI metadata can be read
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api /installation/repositories | jq -e '.total_count == 1 and .repositories[0].full_name == "misaon/nylzo"' > /dev/null
          gh api repos/misaon/nylzo/actions/workflows/ci.yml --jq .id > /dev/null
          echo 'Repository-scoped App credentials verified; token revoked at job completion.'

  merge:
    if: >-
      github.repository == 'misaon/nylzo' && vars.SECURITY_AUTOMATION_ENABLED == 'true' &&
      github.event.workflow_run.name == 'ci' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    name: Merge a verified dependency update after CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: security-automation
    permissions:
      contents: read
      actions: write # continue discovery after a proposal needs manual attention
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # policy contents are verified before any tool or App credential is used
          persist-credentials: false
      - name: Verify and isolate the approved automation policy
        run: |
          echo '088961116d9ef913cb4ef1aa3ff2e23f6146d23747ef6818113d5d1a5f9996d8  tools/security/bootstrap-policy' | sha256sum --check
          bash tools/security/bootstrap-policy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # renovate: datasource=github-releases depName=nodejs/node
          node-version: 24.22.1
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.SECURITY_APP_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
          owner: misaon
          repositories: nylzo
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-workflows: write
      - name: Validate the complete update and merge its exact head
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          WORKFLOW_DISPATCH_TOKEN: ${{ github.token }}
          SECURITY_AUTOMATION_ENABLED: ${{ vars.SECURITY_AUTOMATION_ENABLED }}
          DEPENDENCY_APP_SLUG: ${{ vars.DEPENDENCY_APP_SLUG }}
          DEPENDENCY_BOT_ID: ${{ vars.DEPENDENCY_BOT_ID }}
        run: node "$RUNNER_TEMP/nylzo-security-policy/tools/security/automation.mts" merge

  release:
    if: >-
      github.repository == 'misaon/nylzo' && vars.SECURITY_AUTOMATION_ENABLED == 'true' &&
      github.event.workflow_run.name == 'ci' &&
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'release/v')) &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Tag an approved planned release or isolated dependency patch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: security-automation
    permissions:
      contents: read
      actions: write # regenerate a stale planned-release PR without changing its source
      id-token: write # keyless tag signature bound to this workflow on main
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and isolate the approved automation policy
        run: |
          echo '088961116d9ef913cb4ef1aa3ff2e23f6146d23747ef6818113d5d1a5f9996d8  tools/security/bootstrap-policy' | sha256sum --check
          bash tools/security/bootstrap-policy
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ runner.temp }}/nylzo-security-policy
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.9
          install_args: node gitsign
          working_directory: ${{ runner.temp }}/nylzo-security-policy
          add_shims_to_path: false
          cache: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.SECURITY_APP_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
          owner: misaon
          repositories: nylzo
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-workflows: write # tag an approved ancestor containing workflow changes
      - name: Check out only the source commit whose CI completed
        env:
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$SOURCE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"
      - name: Check full CI and the exact merged release or dependency PR
        id: candidate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          WORKFLOW_DISPATCH_TOKEN: ${{ github.token }}
          SECURITY_AUTOMATION_ENABLED: ${{ vars.SECURITY_AUTOMATION_ENABLED }}
          DEPENDENCY_APP_SLUG: ${{ vars.DEPENDENCY_APP_SLUG }}
          DEPENDENCY_BOT_ID: ${{ vars.DEPENDENCY_BOT_ID }}
        run: node "$RUNNER_TEMP/nylzo-security-policy/tools/security/automation.mts" release
      - name: Sign the patch tag and start the release workflow
        if: steps.candidate.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.commit }}
          RELEASE_KIND: ${{ steps.candidate.outputs.kind }}
          BASE_RELEASE: ${{ steps.candidate.outputs.base }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GITSIGN_TOKEN_PROVIDER: github-actions
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          # Main can advance after approval; the isolated policy already checked
          # that this exact approved source remains its protected ancestor.
          # Maintenance branches must still contain exactly one pending patch.
          if [[ "$SOURCE_BRANCH" != main ]]; then
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$SOURCE_BRANCH" --jq .object.sha)" = "$SOURCE_COMMIT"
          fi
          git -c user.name='Nylzo security automation' -c user.email='automation@nylzo.com' -c gpg.format=x509 -c gpg.x509.program=gitsign tag -s "$RELEASE_TAG" "$SOURCE_COMMIT" -m "Nylzo ${RELEASE_TAG#v}

          Release-Kind: $RELEASE_KIND
          Base-Release: $BASE_RELEASE
          Policy-Commit: $GITHUB_SHA"
          bash "$RUNNER_TEMP/nylzo-security-policy/tools/security/verify-keyless-tag" "$RELEASE_TAG" "$SOURCE_COMMIT" workflow_run
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          echo "::add-mask::$authorization"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin "refs/tags/${RELEASE_TAG}"
      - name: Hold release coordination until immutable publication completes
        if: steps.candidate.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.commit }}
        run: bash "$RUNNER_TEMP/nylzo-security-policy/tools/release/wait-publication" "$RELEASE_TAG" "$SOURCE_COMMIT"


  published:
    if: >-
      github.repository == 'misaon/nylzo' && github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'release' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Record publication and refresh the planned release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # record the lifecycle of the already merged release PR
      actions: write # explicit workflow_dispatch is allowed with GITHUB_TOKEN
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - name: Verify the publishing workflow and immutable release before recording it
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_APP_SLUG: ${{ vars.DEPENDENCY_APP_SLUG }}
          DEPENDENCY_BOT_ID: ${{ vars.DEPENDENCY_BOT_ID }}
        run: node tools/release/published.mts
