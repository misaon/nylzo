name: Plan release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'misaon/nylzo' && github.ref == 'refs/heads/main'
    name: Update the planned release PR
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: dependency-updates
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.DEPENDENCY_APP_CLIENT_ID || vars.DEPENDENCY_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          owner: misaon
          repositories: nylzo
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          skip-github-release: true
