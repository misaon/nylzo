name: monitor

on:
  schedule:
    - cron: "23 * * * *"
    - cron: "8,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  host:
    name: Authenticated host readiness
    if: vars.NYLZO_HOST_MONITOR_URL != '' && github.ref == 'refs/heads/main'
    environment: host-monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
      - name: Read coarse host status over mutual TLS
        env:
          URL: ${{ vars.NYLZO_HOST_MONITOR_URL }}
          MONITOR_ADDRESS: ${{ vars.NYLZO_HOST_MONITOR_ADDRESS }}
          MONITOR_CERT: ${{ secrets.NYLZO_MONITOR_CERT }}
          MONITOR_KEY: ${{ secrets.NYLZO_MONITOR_KEY }}
        run: |
          for attempt in 1 2 3; do
            if node tools/security/monitor-host.mts; then exit 0; fi
            if [[ "$attempt" != 3 ]]; then sleep 75; fi
          done
          exit 1

  web-client:
    name: Released web client and message lifecycle (AK25)
    if: vars.NYLZO_MONITOR_URL != '' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '23 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Find the release the server runs
        id: release
        env:
          URL: ${{ vars.NYLZO_MONITOR_URL }}
        run: |
          version=$(curl -fsS --proto '=https' --max-redirs 0 --max-time 30 "${URL}/.well-known/nylzo/client.json" | jq -r .server)
          if [[ ! "${version}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The server does not report a release version, so there is no release to compare with."
            exit 1
          fi
          echo "tag=v${version#v}" >> "${GITHUB_OUTPUT}"
      - name: The server runs the latest release, or the one before for a day
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          latest=$(gh release view -R "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)
          published=$(gh release view -R "${GITHUB_REPOSITORY}" --json publishedAt --jq .publishedAt)
          if [[ "${TAG}" != "${latest}" ]]; then
            newest=$(printf '%s\n%s\n' "${TAG}" "${latest}" | sort -V | tail -n 1)
            age=$(( $(date -u +%s) - $(date -u -d "${published}" +%s) ))
            if [[ "${newest}" != "${TAG}" && "${age}" -gt 86400 ]]; then
              echo "The server runs ${TAG}, older than ${latest}, which was published more than a day ago."
              exit 1
            fi
          fi
      - name: Download that release and verify its signature
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "${TAG}" -R "${GITHUB_REPOSITORY}" -p checksums.txt -p checksums.txt.sigstore.json -p "nylzo_${TAG#v}_linux_amd64.tar.gz"
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf "nylzo_${TAG#v}_linux_amd64.tar.gz" nylzo
      - name: Compare the served web client with the release
        env:
          URL: ${{ vars.NYLZO_MONITOR_URL }}
          ALLOW: ${{ vars.NYLZO_MONITOR_ALLOW_HEADERS }}
        run: |
          read -ra headers <<< "${ALLOW}"
          args=()
          for header in "${headers[@]}"; do args+=(--allow-header "${header}"); done
          token=$(openssl rand -hex 16)
          echo "::stop-commands::${token}"
          set +e
          ./nylzo verify-client --server "${URL}" "${args[@]}"
          status=$?
          echo "::${token}::"
          exit "${status}"
      - name: Create, decrypt, and consume a short-lived synthetic message
        env:
          URL: ${{ vars.NYLZO_MONITOR_URL }}
        run: node tools/security/monitor-instance.mts
