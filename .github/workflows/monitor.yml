name: monitor

on:
  schedule:
    - cron: "23 * * * *"
    - cron: "8,38,53 * * * *"
  workflow_run: # zizmor: ignore[dangerous-triggers] -- Runs main's definition for the watchdog only; reads the GitHub API and never downloads or runs anything from the triggering run.
    workflows: [ci, Release tag, release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-${{ github.event_name }}
  cancel-in-progress: false
  queue: max

jobs:
  maintenance:
    name: Maintenance publication watchdog
    if: >-
      github.repository == 'misaon/nylzo' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        with:
          tools: bun
          cache: none
      - run: bun install --cwd automation --frozen-lockfile --ignore-scripts
      - name: Detect an unpublished maintenance commit older than one hour
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun automation/release-tag/stalled.ts

  host:
    name: Authenticated host readiness
    if: vars.NYLZO_HOST_MONITOR_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'workflow_run'
    environment: host-monitoring
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: bun
      - name: Read coarse host status over mutual TLS
        env:
          URL: ${{ secrets.NYLZO_HOST_MONITOR_URL }}
          MONITOR_ADDRESS: ${{ secrets.NYLZO_HOST_MONITOR_ADDRESS }}
          MONITOR_CERT: ${{ secrets.NYLZO_MONITOR_CERT }}
          MONITOR_KEY: ${{ secrets.NYLZO_MONITOR_KEY }}
        run: |
          for attempt in 1 2 3; do
            if bun tools/security/monitor-host.mts; then exit 0; fi
            if [[ "$attempt" != 3 ]]; then sleep 75; fi
          done
          exit 1

  domain:
    name: DNS, certificate transparency and registration of the domain
    if: vars.NYLZO_MONITOR_DOMAIN != '' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '23 * * * *')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: bun
      - name: CAA, mail records, registrar lock and every new certificate match the expected state
        env:
          DOMAIN: ${{ vars.NYLZO_MONITOR_DOMAIN }}
          ACME_ACCOUNT: ${{ vars.NYLZO_ACME_ACCOUNT }}
          CT_REVIEWED_UNTIL: ${{ vars.NYLZO_CT_REVIEWED_UNTIL }}
        run: bun tools/security/monitor-domain.mts

  web-client:
    name: Signed release and message lifecycle (AK25)
    if: vars.NYLZO_MONITOR_URL != '' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '23 * * * *')
    # The instance accepts only X25519MLKEM768, which needs OpenSSL 3.5 or newer in curl.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: bun
      - id: release
        uses: $/.github/actions/released-nylzo
        with:
          url: ${{ vars.NYLZO_MONITOR_URL }}
      - name: Create, decrypt, and consume a short-lived synthetic message
        env:
          URL: ${{ vars.NYLZO_MONITOR_URL }}
        run: bun tools/security/monitor-instance.mts

  browser:
    name: A browser receives the signed web client (A3-07)
    needs: [web-client]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/mise
        with:
          tools: bun
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign
          cosign-release: v3.1.4
      - name: Install locked dependencies without lifecycle scripts
        run: bun automation/web-install/main.ts
      - name: Signed checksums of the release the server runs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.web-client.outputs.tag }}
        run: |
          gh release download "${TAG}" -R "${GITHUB_REPOSITORY}" -p checksums.txt -p checksums.txt.sigstore.json
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" > /dev/null 2>&1
      - name: Google Chrome in a window creates and reads a message and receives only signed assets
        env:
          NYLZO_MONITOR_URL: ${{ vars.NYLZO_MONITOR_URL }}
        run: |
          export NYLZO_MONITOR_CHECKSUMS="${GITHUB_WORKSPACE}/checksums.txt"
          if ! xvfb-run --auto-servernum bun run --cwd web/e2e --bun playwright test -c playwright.monitor.config.ts --reporter=dot > /dev/null 2>&1; then
            echo "The browser check failed."
            exit 1
          fi
