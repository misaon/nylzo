name: Renovate

on:
  # The production watch starts the regular runs every six hours (automation/watch/due.ts).
  workflow_run: # zizmor: ignore[dangerous-triggers] -- Runs main's definition to wake Renovate after CI; never downloads or executes PR artifacts.
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inventory:
    if: >-
      github.repository == 'misaon/nylzo' && github.ref == 'refs/heads/main' &&
      vars.SECURITY_AUTOMATION_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch'
    name: Vulnerability inventory of the maintained releases and main
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    concurrency:
      group: vulnerability-inventory
      cancel-in-progress: false
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: $/.github/actions/setup
        with:
          tools: bun cosign grype osv-scanner
          cache: none
      - name: Find the latest immutable release and the latest of every maintained line
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq 'select(.immutable and (.draft | not)) | .tag_name')
          releases=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.immutable and (.draft | not) and (.prerelease | not)) | .tag_name')
          lines=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches" --jq '.[].name | select(test("^release/v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) | ltrimstr("release/")')
          tags="$latest"
          for line in $lines; do
            tag=$(grep -E "^${line//./\\.}\\.(0|[1-9][0-9]*)$" <<< "$releases" | sort --version-sort | tail -n 1 || true)
            if [[ -n "$tag" && " $tags " != *" $tag "* ]]; then tags="$tags $tag"; fi
          done
          for tag in $tags; do [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; done
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Check out each of those releases
        env:
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          for tag in $TAGS; do
            git fetch --no-tags --depth 1 origin "+refs/tags/${tag}:refs/tags/${tag}"
            git worktree add --detach "published/${tag}" "refs/tags/${tag}"
          done
      - run: bun install --cwd automation --frozen-lockfile --ignore-scripts
      - name: Scan those releases, every source tree and every pinned tool
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          arguments=()
          for tag in $TAGS; do arguments+=(--published "published/${tag}" --release-tag "$tag"); done
          bun automation/vulnerability-scan/inventory.ts "${arguments[@]}" --main . --reports "$RUNNER_TEMP/vulnerability-inventory"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vulnerability-inventory
          path: ${{ runner.temp }}/vulnerability-inventory
          if-no-files-found: error
          retention-days: 14
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vulnerability-inventory/affected.json
          key: vulnerability-inventory-${{ github.run_id }}

  renovate:
    needs: inventory
    if: >-
      always() && github.repository == 'misaon/nylzo' && vars.SECURITY_AUTOMATION_ENABLED == 'true' &&
      needs.inventory.result != 'cancelled' &&
      (github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' || startsWith(github.event.workflow_run.head_branch, 'renovate/'))))
    name: Propose, rebase and merge dependency updates
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: dependency-updates
    concurrency:
      group: renovate
      cancel-in-progress: false
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: $/.github/actions/setup
        with:
          tools: bun
          cache: none
          ref: main
      - run: bun install --cwd automation --frozen-lockfile --ignore-scripts
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vulnerability-inventory/affected.json
          key: vulnerability-inventory-${{ github.run_id }}
          restore-keys: vulnerability-inventory-
      - name: Select the maintenance branch and the vulnerability fast path
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          bun automation/renovate/main.ts --affected "$RUNNER_TEMP/vulnerability-inventory/affected.json"
          --output "$RUNNER_TEMP/renovate-global.json"
      - name: Name this week's metadata cache
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: metadata-cache
        with:
          path: /tmp/renovate-cache
          key: renovate-public-metadata-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: renovate-public-metadata-${{ runner.os }}-
      - name: Restore cache ownership for the unprivileged Renovate user
        if: steps.metadata-cache.outputs.cache-matched-key != ''
        run: |
          test -d /tmp/renovate-cache && test ! -L /tmp/renovate-cache
          sudo chown --recursive --no-dereference 12021:0 /tmp/renovate-cache
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          # The permissions Renovate documents for a GitHub App; without checks, statuses and issues it aborts each run.
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write # update pinned actions and annotated tool versions
          permission-actions: read
          permission-vulnerability-alerts: read
      - uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        env:
          LOG_LEVEL: ${{ inputs.debug && 'debug' || 'info' }}
          # The image's Google auth library otherwise probes the GCE metadata server on every run.
          METADATA_SERVER_DETECTION: none
        with:
          env-regex: ^(?:RENOVATE_\w+|LOG_LEVEL|METADATA_SERVER_DETECTION)$
          token: ${{ steps.app.outputs.token }}
          configurationFile: ${{ runner.temp }}/renovate-global.json
          renovate-image: ghcr.io/renovatebot/renovate:44.223.0@sha256:3594d8e9b7b402950c5ec5f532647659bb2b01ca2c90e47e1f01834b02136d11
          mount-docker-socket: false
          docker-volumes: /tmp:/tmp;${{ github.workspace }}/automation/dependency-sync/sync.ts:/opt/nylzo-dependency-sync.ts:ro
      # Runs started by another workflow may only read the cache; the regular run writes it once a week.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && github.event_name != 'workflow_run' && steps.metadata-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/renovate-cache
          key: renovate-public-metadata-${{ runner.os }}-${{ steps.week.outputs.week }}
