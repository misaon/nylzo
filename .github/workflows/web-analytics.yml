name: Web Analytics beacon

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: web-analytics-beacon
  cancel-in-progress: true

jobs:
  check:
    name: Cloudflare serves the pinned beacon
    if: github.repository == 'misaon/nylzo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: $/.github/actions/setup
        with:
          tools: bun
          cache: none
      # Cloudflare does not support pinning, so a changed beacon fails this run until a release pins the reviewed file.
      - name: Compare the served beacon with the pinned one
        run: bun web/app/scripts/web-analytics-beacon.ts
