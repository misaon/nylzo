name: Crawler ranges

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      accept-shrink:
        description: Propose sources that list far fewer ranges than their committed ones, after comparing them with the published lists
        type: boolean
        default: false

permissions: {}

concurrency:
  group: crawler-ranges
  cancel-in-progress: false

jobs:
  refresh:
    name: Propose the published crawler ranges
    if: github.repository == 'misaon/nylzo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: dependency-updates
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: $/.github/actions/setup
        with:
          tools: bun
          cache: none
      # A suspicious list stops here and the committed list stays as it is; a source that does not download keeps its own committed ranges.
      - name: Download and check the published ranges
        id: refresh
        env:
          ACCEPT_SHRINK: ${{ inputs.accept-shrink == true }}
        run: |
          if [ "$ACCEPT_SHRINK" = true ]; then bun tools/crawler-ranges.mts --accept-shrink; else bun tools/crawler-ranges.mts; fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # GitHub signs a commit made through the API, so the branch passes the signed-commit rule.
      - name: Open, update or close the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: automation/crawler-ranges
          TITLE: "fix(deploy): update the published crawler ranges"
          KEPT: ${{ steps.refresh.outputs.kept }}
          ACCEPT_SHRINK: ${{ inputs.accept-shrink == true }}
        run: |
          file=deploy/caddy/crawlers.json
          open=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if git diff --quiet -- "$file"; then
            if [ -n "$open" ]; then gh pr close "$open" --delete-branch --comment "The published ranges match main again."; fi
            exit 0
          fi
          git diff --stat -- "$file"
          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The weekly refresh of the search engine and AI crawler ranges that may use X25519 (docs/wiki/guides/Security-model.md#transport). Check the diff for ranges that are not crawler addresses; they reach production with the next release."
          if [ -n "$KEPT" ]; then
            body+=$'\n\n'"These sources did not download in [the latest run](${run}), so they keep their committed ranges: ${KEPT// /, }."
          fi
          if [ "$ACCEPT_SHRINK" = true ]; then
            body+=$'\n\n'"[The latest run](${run}) was started by hand to accept sources that list far fewer ranges than before; its warnings name them."
          fi
          proposed=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=${BRANCH}" --jq .content 2> /dev/null | base64 --decode | sha256sum || true)
          describe() { gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${open}" -f body="$body" > /dev/null; }
          if [ -n "$open" ] && [ "$proposed" = "$(sha256sum < "$file")" ]; then describe; exit 0; fi
          head=$(git rev-parse HEAD)
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" -f sha="$head" -F force=true > /dev/null 2>&1 \
            || gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="$head" > /dev/null
          jq --null-input \
            --arg repository "$GITHUB_REPOSITORY" --arg branch "$BRANCH" --arg head "$head" --arg title "$TITLE" \
            --arg contents "$(base64 --wrap=0 "$file")" --arg path "$file" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {branch: {repositoryNameWithOwner: $repository, branchName: $branch}, expectedHeadOid: $head,
                message: {headline: $title}, fileChanges: {additions: [{path: $path, contents: $contents}]}}}}' \
            | gh api graphql --input - > /dev/null
          if [ -z "$open" ]; then
            gh pr create --head "$BRANCH" --base main --title "$TITLE" --body "$body"
          else
            describe
          fi
      # A source that did not download needs a person, so the run fails after the other sources are proposed.
      - name: Fail when a source kept its committed ranges
        if: steps.refresh.outputs.kept != ''
        env:
          KEPT: ${{ steps.refresh.outputs.kept }}
        run: |
          echo "::error title=Crawler ranges::These sources did not download and keep their committed ranges: ${KEPT// /, }. The warnings of the first step say why."
          exit 1
