name: Crawler ranges

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: crawler-ranges
  cancel-in-progress: false

jobs:
  refresh:
    name: Propose the published crawler ranges
    if: github.repository == 'misaon/nylzo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: dependency-updates
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: $/.github/actions/setup
        with:
          tools: bun
          cache: none
      # A failed or suspicious download stops here and the committed list stays as it is.
      - name: Download and check the published ranges
        run: bun tools/crawler-ranges.mts
      - name: Compare with the committed list
        id: change
        run: |
          if git diff --quiet -- deploy/caddy/crawlers.json; then
            echo changed=false >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- deploy/caddy/crawlers.json
            echo changed=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.change.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # GitHub signs a commit made through the API, so the branch passes the signed-commit rule.
      - if: steps.change.outputs.changed == 'true'
        name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: automation/crawler-ranges
          TITLE: "fix(deploy): update the published search engine crawler ranges"
        run: |
          head=$(git rev-parse HEAD)
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" -f sha="$head" -F force=true > /dev/null 2>&1 \
            || gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${BRANCH}" -f sha="$head" > /dev/null
          jq --null-input \
            --arg repository "$GITHUB_REPOSITORY" --arg branch "$BRANCH" --arg head "$head" --arg title "$TITLE" \
            --arg contents "$(base64 --wrap=0 deploy/caddy/crawlers.json)" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {branch: {repositoryNameWithOwner: $repository, branchName: $branch}, expectedHeadOid: $head,
                message: {headline: $title}, fileChanges: {additions: [{path: "deploy/caddy/crawlers.json", contents: $contents}]}}}}' \
            | gh api graphql --input - > /dev/null
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main --title "$TITLE" \
              --body "The weekly refresh of the Google, Bing and Seznam crawler ranges that may use X25519 (docs/wiki/guides/Security-model.md#transport). Check the diff for ranges that are not crawler addresses; they reach production with the next release."
          fi
