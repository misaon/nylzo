name: Release tag
run-name: Release tag ${{ inputs.task || github.event_name }}

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- Runs main's definition, reads only API metadata and never checks out or executes the tagged commit.
    workflows: [ci, release]
    types: [completed]
  # The production watch opens the dependency release windows on Monday, Wednesday and Friday (automation/watch/due.ts).
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [signing-probe, dependency-window]
        default: signing-probe

permissions: {}

jobs:
  tag:
    if: >-
      github.repository == 'misaon/nylzo' && vars.SECURITY_AUTOMATION_ENABLED == 'true' &&
      github.event_name == 'workflow_run' && github.event.workflow_run.name == 'ci' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.event == 'push' &&
        (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'release/v'))) ||
       (github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.head_branch, 'release/v')))
    name: Tag a merged release PR, a security fix or a dependency release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: dependency-updates
    concurrency:
      group: release-tag
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      checks: read # the release commit passed full CI and every CodeQL analysis
      id-token: write # keyless tag signature bound to this workflow on main
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: $/.github/actions/setup
        with:
          tools: bun gitsign
          cache: none
          ref: main
          fetch-depth: 0
      - run: bun install --cwd automation --frozen-lockfile --ignore-scripts
      - name: Decide the release for the commit whose CI completed
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPENDENCY_APP_SLUG: ${{ vars.DEPENDENCY_APP_SLUG }}
          DEPENDENCY_BOT_ID: ${{ vars.DEPENDENCY_BOT_ID }}
        run: bun automation/release-tag/main.ts
      - name: The release commit passed full CI and every CodeQL analysis
        if: steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.plan.outputs.commit }}
        run: bash mise-tasks/release/checks "$SOURCE_COMMIT"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.plan.outputs.tag != ''
        id: app
        with:
          client-id: ${{ vars.DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write # tag a commit whose tree contains workflows
      - name: Sign, verify and push the release tag
        if: steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_KIND: ${{ steps.plan.outputs.kind }}
          BASE_RELEASE: ${{ steps.plan.outputs.base }}
          SOURCE_COMMIT: ${{ steps.plan.outputs.commit }}
          GITSIGN_TOKEN_PROVIDER: github-actions
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$SOURCE_COMMIT"
          git -c user.name='Nylzo release automation' -c user.email='automation@nylzo.com' -c gpg.format=x509 -c gpg.x509.program=gitsign tag -s "$RELEASE_TAG" "$SOURCE_COMMIT" -m "Nylzo ${RELEASE_TAG#v}

          Release-Kind: $RELEASE_KIND
          Base-Release: $BASE_RELEASE
          Policy-Commit: $GITHUB_SHA"
          bash tools/security/verify-keyless-tag "$RELEASE_TAG" "$SOURCE_COMMIT" workflow_run
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          echo "::add-mask::$authorization"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin "refs/tags/${RELEASE_TAG}"

  published:
    if: >-
      github.repository == 'misaon/nylzo' && github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'release' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Open the maintenance branch and record the published release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    concurrency:
      group: release-published
      cancel-in-progress: false
      queue: max
    environment: dependency-updates
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: $/.github/actions/setup
        with:
          tools: bun
          cache: none
          ref: main
      - run: bun install --cwd automation --frozen-lockfile --ignore-scripts
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          permission-contents: write # create the maintenance branch of a planned release
          permission-pull-requests: write # label the merged release PR as tagged
          permission-workflows: write # create a ref at a commit containing workflows
      - env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: bun automation/release-tag/published.ts

  dependency-window:
    if: >-
      github.repository == 'misaon/nylzo' && vars.SECURITY_AUTOMATION_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' && inputs.task == 'dependency-window'
    name: Open a dependency release window on the maintenance branch
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment:
      name: dependency-updates
      deployment: false
    concurrency:
      group: dependency-window
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # GitHub documents that an App token, unlike GITHUB_TOKEN, starts further workflows: the CI run's success must start the tag job.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          permission-actions: write # run the full CI on the maintenance branch
          permission-contents: read
      - name: Run CI on the maintenance branch when it holds unreleased changes
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq 'select(.immutable and (.draft | not)) | .tag_name')
          [[ "$latest" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          branch="release/${latest%.*}"
          ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${latest}...${branch}" --jq .ahead_by)
          if [[ "$ahead" = 0 ]]; then
            echo "$branch holds nothing after $latest." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          echo "CI runs on $branch ($ahead commits after $latest); its success tags the dependency release." >> "$GITHUB_STEP_SUMMARY"

  signing-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'signing-probe' && github.repository == 'misaon/nylzo'
    name: Verify keyless tag signing without publishing
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: signing-probe
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write # test the exact release signing identity without a persistent signing key
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: $/.github/actions/setup
        with:
          tools: gitsign
          cache: none
      - name: Sign and verify a local tag; do not push it
        env:
          GITSIGN_TOKEN_PROVIDER: github-actions
        run: |
          tag="automation-probe-${GITHUB_RUN_ID}"
          git -c user.name='Nylzo release automation' -c user.email='automation@nylzo.com' -c gpg.format=x509 -c gpg.x509.program=gitsign tag -s "$tag" -m 'Local automation signing check'
          bash tools/security/verify-keyless-tag "$tag" "$GITHUB_SHA" workflow_dispatch
