version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    commit-message:
      prefix: fix
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: fix
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
  - package-ecosystem: npm
    directory: /web
    commit-message:
      prefix: fix
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
