version: 2
updates:
  - package-ecosystem: terraform
    directories:
      - /deploy/hetzner-flatcar/infrastructure/image
      - /deploy/hetzner-flatcar/infrastructure/server
      - /deploy/hetzner-flatcar/infrastructure/dns
    commit-message:
      prefix: fix
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
  - package-ecosystem: gomod
    directory: /
    commit-message:
      prefix: fix
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: fix
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
  - package-ecosystem: npm
    directory: /web
    commit-message:
      prefix: fix
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
