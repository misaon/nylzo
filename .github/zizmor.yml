rules:
  cache-poisoning:
    ignore:
      # The release/v* push trigger makes zizmor classify CI as publication.
      # CI only validates source. PR caches are scoped to their merge refs;
      # publication rebuilds from source in release.yml with caches disabled
      # and never promotes a CI build artifact. Keep caching validation tools
      # and package downloads; release-checks.test.mts guards this separation.
      - ci.yml
  dangerous-triggers:
    ignore:
      # The required Dependency guard check runs on pull_request_target so a
      # pull request cannot replace the guard. It checks out only the default
      # branch without credentials, runs no pull request code, reads the pull
      # request through the API with a read-only token and uses no secrets.
      - dependency-guard.yml
