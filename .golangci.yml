version: "2"

run:
  timeout: 10m

linters:
  default: all
  disable:
    # Formatting and blank-line rules that gofumpt and golines already settle.
    - lll
    - nlreturn
    - wsl
    - wsl_v5
    # Inline `if err := f(); err != nil` keeps err in the smallest scope, which Go style prefers.
    - noinlineerr
    # Zero values are deliberate defaults; listing every field of net/http and crypto/tls structs adds noise.
    - exhaustruct
    - exhaustruct_v5
    # JSON names follow spec/protocol.md, not a naming rule.
    - tagliatelle
    # Errors cross package boundaries with %w where the caller gains context; wrapping every return does not.
    - wrapcheck
    # Package-level values are immutable lookup tables, compiled patterns and test seams.
    - gochecknoglobals
    # Tests use package internals, and the scrypt tests need several GiB each, so they must not run in parallel.
    - paralleltest
    - testpackage
    # Replaced by depguard, which also forbids math/rand.
    - gomodguard
    - gomodguard_v2
  settings:
    cyclop:
      max-complexity: 15
    depguard:
      rules:
        main:
          list-mode: strict
          allow:
            - $gostd
            - github.com/misaon/nylzo
            - filippo.io/edwards25519
            - golang.org/x/crypto
            - golang.org/x/sys
            - golang.org/x/term
            - golang.org/x/text
            - modernc.org/sqlite
          files:
            - "!**/deploy/caddy/**"
          deny:
            - pkg: math/rand$
              desc: use crypto/rand, or math/rand/v2 where predictability does not matter
        caddy:
          list-mode: strict
          files:
            - "**/deploy/caddy/**"
          allow:
            - $gostd
            - github.com/misaon/nylzo
            - github.com/caddyserver/caddy/v2
            - github.com/quic-go/quic-go
          deny:
            - pkg: math/rand$
              desc: use crypto/rand, or math/rand/v2 where predictability does not matter
    dupl:
      threshold: 100
    embeddedstructfieldcheck:
      forbid-mutex: true
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*database/sql.Tx).Rollback
    errchkjson:
      check-error-free-encoding: true
      report-no-exported: true
    errorlint:
      errorf: false
    exhaustive:
      check: [switch, mapliteral]
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print.*|print|println)$
        - pattern: ^log\.(Print|Fatal|Panic).*$
        - pattern: ^slog\.(Debug|Info|Warn|Error|Log|LogAttrs|Default|SetDefault)(Context)?$
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 15
    gocritic:
      enabled-tags: [diagnostic, style, performance, opinionated]
    gosec:
      excludes: [G104]
    gomoddirectives:
      replace-local: true
    gosmopolitan:
      allow-time-local: true
    govet:
      enable-all: true
      disable: [fieldalignment]
      settings:
        shadow:
          strict: true
    mnd:
      ignored-numbers: ["0", "1", "2", "0o600", "0o644", "0o700", "0o755"]
      ignored-functions:
        - ^os\.(Chmod|Mkdir|MkdirAll|OpenFile|WriteFile)$
        - ^strconv\.(Format|Parse|Append)
        - ^time\.Date$
    nakedret:
      max-func-lines: 0
    nestif:
      min-complexity: 4
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: confusing-naming
        - name: early-return
        - name: enforce-switch-style
        - name: exported
          arguments:
            - disableChecksOnConstants
            - disableChecksOnFunctions
            - disableChecksOnMethods
            - disableChecksOnTypes
            - disableChecksOnVariables
        - name: identical-branches
        - name: import-shadowing
        - name: indent-error-flow
        - name: package-naming
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: redundant-test-main-exit
        - name: superfluous-else
        - name: unnecessary-format
        - name: unnecessary-stmt
        - name: unused-receiver
        - name: use-any
        - name: use-waitgroup-go
        - name: var-naming
    sloglint:
      no-global: all
      static-msg: true
      context: scope
      key-naming-case: snake
    staticcheck:
      checks: ["all", "-ST1000", "-ST1020", "-ST1021", "-ST1022"]
    usetesting:
      os-temp-dir: true
      context-background: true
      context-todo: true
    varnamelen:
      ignore-names: [err, ok, id, i, j, tx]
      ignore-decls:
        - w http.ResponseWriter
        - r *http.Request
        - t *testing.T
        - b *testing.B
        - f *testing.F
        - tb testing.TB
        - ctx context.Context
  exclusions:
    # The Caddy module runs with this file too and would report every rule that only the root module needs.
    warn-unused: false
    presets: [std-error-handling, common-false-positives]
    rules:
      - path: _test\.go
        linters: [dupl, dupword, funlen, gocognit, gocyclo, maintidx, cyclop, goconst, errcheck, errchkjson, err113, forcetypeassert, gosec, mnd, noctx, prealloc, varnamelen]
      # Caddy registers plugin modules from init, and its Provisioner interface takes caddy.Context by value.
      - path: deploy/caddy/
        linters: [gochecknoinits]
      - path: deploy/caddy/
        linters: [gocritic]
        text: "hugeParam: _ is heavy"
      # Close follows io.Closer and finishes its last checkpoint after the caller's context may have ended.
      - linters: [contextcheck]
        text: "Function `Close` should pass the context parameter"
      # The lease timer fires minutes after its request and must not keep that request's context alive.
      - linters: [contextcheck]
        text: "releaseAtLeaseEnd"
      # Spec vectors, store test cases and the defaults table name their numbers through the field they fill.
      - path: internal/(vectors/|store/storetest/|server/config/config\.go)
        linters: [mnd]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable: [gofumpt, goimports, golines]
  settings:
    gofumpt:
      module-path: github.com/misaon/nylzo
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    goimports:
      local-prefixes: [github.com/misaon/nylzo]
    golines:
      max-len: 120
